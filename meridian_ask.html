<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian · Ask</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#121823; --panel2:#0f141d; --edge:#1f2937;
    --ink:#e7edf5; --ink-dim:#9aa7b8; --ink-faint:#5b6776;
    --accent:#5b9dff; --accent-soft:#1b2a44; --good:#34d399; --warn:#fbbf24; --hot:#fb7185; --gap:#c084fc;
    --r:14px; --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,#10192a 0%,var(--bg) 55%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline} a{cursor:pointer}

  #topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:14px;
    padding:0 22px;background:rgba(10,14,20,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--edge);
    transform:translateY(-100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:50}
  body.answer #topbar{transform:translateY(0)}
  .brand{font-weight:700;letter-spacing:.3px;font-size:15px;white-space:nowrap;cursor:pointer}
  .brand b{color:var(--accent)}
  #topsearch{flex:1;max-width:760px;position:relative}
  #topsearch input{width:100%;height:40px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);
    color:var(--ink);padding:0 14px;font-size:14px;outline:none}
  #topsearch input:focus{border-color:var(--accent)}
  .kbd{font-family:var(--mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--edge);border-radius:6px;padding:2px 6px}
  .toplink{font-size:12.5px;color:var(--ink-dim);border:1px solid var(--edge);border-radius:8px;padding:6px 11px;white-space:nowrap;text-decoration:none}
  .toplink:hover{border-color:var(--accent);color:var(--ink);text-decoration:none}

  #hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:26px}
  body.answer #hero{display:none}
  .h-title{font-size:42px;font-weight:760;letter-spacing:-.5px;margin:0;text-align:center}
  .h-title b{color:var(--accent)}
  .h-sub{color:var(--ink-dim);font-size:16px;margin:-12px 0 6px;text-align:center;max-width:580px;line-height:1.5}
  #hero .searchwrap{width:min(720px,92vw)}
  .searchbox{position:relative}
  .searchbox input{width:100%;height:62px;border-radius:16px;border:1px solid #28344a;
    background:linear-gradient(180deg,#141c2a,#0f1622);color:var(--ink);padding:0 60px 0 22px;font-size:18px;outline:none;
    box-shadow:0 18px 60px -24px rgba(0,0,0,.8)}
  .searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 18px 60px -24px rgba(0,0,0,.8)}
  .searchbox .go{position:absolute;right:10px;top:10px;height:42px;width:42px;border-radius:11px;border:none;
    background:var(--accent);color:#04101f;font-size:20px;cursor:pointer;display:grid;place-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:780px}
  .chip{font-size:13px;color:var(--ink-dim);background:var(--panel);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.think{border-color:#3a2d52;color:#cdb6ef}.chip.think:hover{border-color:var(--gap)}
  .meta{color:var(--ink-faint);font-size:12.5px;font-family:var(--mono)}

  #canvas{display:none;max-width:1200px;margin:0 auto;padding:88px 22px 90px}
  body.answer #canvas{display:block}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  .askedline{color:var(--ink-faint);font-size:13px;font-family:var(--mono);margin:0 0 8px}
  .answer-h{font-size:26px;font-weight:730;letter-spacing:-.3px;margin:0 0 4px;line-height:1.2}
  .answer-tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-family:var(--mono);text-transform:uppercase;
    letter-spacing:.6px;color:var(--accent);background:var(--accent-soft);border:1px solid #25406e;border-radius:999px;padding:4px 11px;margin-bottom:14px}
  .answer-tag.reason{color:#d6c2f5;background:#1d1630;border-color:#3a2d52}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-dim);font-weight:650}
  .big-answer{font-size:18.5px;line-height:1.6}
  .big-answer .hl{color:#fff;font-weight:680}
  .synth-answer{font-size:18px;line-height:1.66;color:#eef3fa}

  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14.5px}
  .kv .k{color:var(--ink-faint);font-family:var(--mono);font-size:12.5px;padding-top:2px}
  .kv .v{color:var(--ink)}
  .pill{display:inline-block;font-size:12px;border-radius:7px;padding:3px 9px;border:1px solid var(--edge);background:#0c121c;color:var(--ink-dim);margin:2px 5px 2px 0}
  .pill.stage{color:var(--accent);border-color:#27406b;background:var(--accent-soft)}
  .pill.direct{color:var(--hot);border-color:#5e2733;background:#2a1116}
  .pill.good{color:var(--good);border-color:#1d4a3a;background:#0c1f18}

  table.rows{width:100%;border-collapse:collapse;font-size:13.5px}
  table.rows th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-bottom:1px solid var(--edge)}
  table.rows td{padding:9px 10px;border-bottom:1px solid #161e2a;vertical-align:top}
  table.rows tr:hover td{background:#0e1622}
  .rank{color:var(--ink-faint);font-family:var(--mono)}
  .num{font-family:var(--mono);color:#fff}

  /* reasoning bullets */
  .reason-list{list-style:none;margin:0;padding:0}
  .reason-list li{position:relative;padding:11px 0 11px 92px;border-bottom:1px solid #161e2a;font-size:14.5px;line-height:1.55;color:var(--ink)}
  .reason-list li:last-child{border-bottom:none}
  .tag-lbl{position:absolute;left:0;top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;border-radius:6px;padding:2px 7px}
  .t-fact{color:var(--accent);background:var(--accent-soft);border:1px solid #25406e}
  .t-judge{color:#d6c2f5;background:#1d1630;border:1px solid #3a2d52}
  .t-gap{color:#fbbf24;background:#2a2110;border:1px solid #5a4718}

  .side h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);margin:2px 0 10px}
  .conn{display:block;background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .conn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .conn .ct{font-size:14px;color:var(--ink);font-weight:600}
  .conn .cs{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);margin-top:3px}
  .conn .rel{font-size:10.5px;color:var(--accent);font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
  .res{display:block;font-size:12.5px;padding:8px 11px;border:1px solid var(--edge);border-left:2px solid var(--accent);border-radius:8px;margin-bottom:7px;background:#0d1320}
  .res .rt{color:var(--ink);font-weight:600}
  .res .rd{color:var(--ink-faint);font-family:var(--mono);font-size:11px;margin-top:2px;word-break:break-all}

  .src{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono)} .src a{color:var(--ink-dim)}
  .followups{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .loading{color:var(--ink-dim);font-family:var(--mono);font-size:13px;padding:24px 0;display:flex;align-items:center;gap:4px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;animation:p 1s infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
  .empty{color:var(--ink-dim);font-size:15px;line-height:1.6}
  .deepen{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:#cdb6ef;
    background:#1d1630;border:1px solid #3a2d52;border-radius:10px;padding:9px 14px;margin:2px 0 4px;transition:.15s}
  .deepen:hover{border-color:var(--gap);background:#241a3a}
  .synthnote{font-size:12px;color:var(--ink-faint);border:1px dashed var(--edge);border-radius:10px;padding:11px 13px;margin-top:6px;line-height:1.5}
  .fbbtn{cursor:pointer;font-size:15px;padding:0 5px;opacity:.65;transition:opacity .15s}.fbbtn:hover{opacity:1}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand" onclick="goHome()">Meridian <b>·</b> Ask</div>
  <form id="topsearch" onsubmit="return submitQ(event,'top')"><input id="qTop" autocomplete="off" placeholder="Ask anything…"></form>
  <span class="kbd">↵</span>
  <a class="toplink" href="meridian_brief.html" title="Daily briefing">▤ Briefing</a>
  <a class="toplink" href="meridian_ask_review.html" target="_blank" title="Review dashboard">▦ Review</a>
  <a class="toplink" href="index.html" title="Back to Meridian dashboard">⌂ Home</a>
</div>

<section id="hero">
  <h1 class="h-title">Ask <b>Meridian</b></h1>
  <p class="h-sub">One question, one answer — retrieved live from the knowledge graph, reasoned over when the question needs judgment, with the connections and sources around it.</p>
  <div class="searchwrap">
    <form class="searchbox" onsubmit="return submitQ(event,'hero')">
      <input id="qHero" autocomplete="off" placeholder="Try a fact (“Tulisokibart”) or a judgment (“what matters most for a preclinical TL1A×IL-23p19 bispecific?”)">
      <button class="go" type="submit">→</button>
    </form>
  </div>
  <div class="chips" id="heroChips"></div>
  <div class="meta" id="bootMeta">connecting…</div>
</section>

<main id="canvas"></main>

<script>
/* ============================================================ *
 *  Meridian · Ask  — answer engine                              *
 *  RETRIEVAL (client, free, cited): resolve -> gather -> render *
 *  SYNTHESIS (server, reasoned, cited): POST bundle to          *
 *  SYNTH_ENDPOINT. Reasoning/judgment questions auto-route;     *
 *  structured answers offer a "Reason deeper" button.           *
 * ============================================================ */
const SUPABASE_URL   = "https://tghntyofptvfhmtchwcv.supabase.co";
const SUPABASE_ANON  = "sb_publishable_3GLfZ7b9Tjp9RFRcc4YZew_ov-fY7dI";
// Synthesis endpoint is environment-aware: localhost runs meridian_ask_synth.py;
// the live site uses the deployed Supabase Edge Function (same /ask + /log contract).
const _ASK_LOCAL = ["localhost","127.0.0.1",""].includes(location.hostname);
const SYNTH_BASE = _ASK_LOCAL ? "http://localhost:8787"
                              : "https://tghntyofptvfhmtchwcv.supabase.co/functions/v1/ask-synth";
const SYNTH_ENDPOINT = SYNTH_BASE + "/ask";   // empty "" would disable synthesis
const LOG_ENDPOINT   = SYNTH_BASE + "/log";   // learning-loop question log
const ASK_KEY = "1rC5ZddlZvtxmEYRQtr6gszpSXweK_n_";  // shared-secret gate (also enforced server-side)
const ASK_HEADERS = {"Content-Type":"application/json","x-meridian-key":ASK_KEY};
function entsPayload(q){ try{ return resolveEntities(q).map(e=>({type:e.type,id:e.id})); }catch(_){ return []; } }
async function askGet(path){ try{ const r=await fetch(SYNTH_BASE+path,{headers:{"x-meridian-key":ASK_KEY}}); return r.ok?await r.json():null; }catch(e){ return null; } }

const H={apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON};
async function sb(table,qs){ const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs}`,{headers:H}); return r.ok?r.json():[]; }
const enc=encodeURIComponent;
const norm=s=>(s||"").toLowerCase().replace(/[×x+]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const tok =s=>norm(s).split(' ').filter(Boolean);
const escapeHtml=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cleanProse(t){ if(!t) return ''; let s=String(t);
  s=s.replace(/^\s*(?:(?:I(?:'|’)?ll|I will|Let me|Let'?s|I(?:'|’)?m going to|First,?\s+let me|Now,?\s+let me)\b[^.?!]*[.?!]["')\]]*\s*)+/i,'');
  s=s.replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/(^|\n)\s{0,3}#{1,6}\s*/g,'$1').replace(/(^|\n)\s*[-*]\s+/g,'$1• ').replace(/\*/g,'');
  s=s.replace(/([a-z0-9,;:])([.?!])([A-Z“"])/g,'$1$2 $3'); return s.trim(); }
const J=o=>JSON.stringify(o).replace(/"/g,'&quot;');

/* ---------- index / resolver ---------- */
let DRUGS=[],COMPANIES=[],NAME2ENT=new Map(),SURFACES=[],TARGET_TOKENS=new Set();
async function boot(){
  DRUGS=await sb("drugs","select=id,name,display_name,brand_name,inn_name,dev_code,aliases,target,company_id,lead_company_id,stage,stage_detail,indication_short,mechanism,overlap,key_data,differentiation_thesis,why_it_matters,drug_summary,modality,source_url&order=id");
  COMPANIES=await sb("companies","select=id,name,ticker,company_type,hq_country,market_cap_display,status");
  const add=(s,e)=>{ if(!s)return; const k=String(s).toLowerCase().trim(); if(k.length<3)return; if(!NAME2ENT.has(k))NAME2ENT.set(k,e); };
  for(const d of DRUGS){
    const e={type:'drug',id:d.id,label:d.display_name||d.name,row:d};
    [d.name,d.display_name&&d.display_name.split('(')[0],d.brand_name,d.inn_name,d.dev_code].forEach(s=>add(s,e));
    (d.aliases||[]).forEach(s=>add(s,e));
    if(d.target) tok(d.target).forEach(t=>{ if(t.length>2)TARGET_TOKENS.add(t); });
  }
  for(const c of COMPANIES) add(c.name,{type:'company',id:c.id,label:c.name,row:c});
  SURFACES=[...NAME2ENT.keys()].sort((a,b)=>b.length-a.length);
  document.getElementById('bootMeta').textContent=`${DRUGS.length} molecules · ${COMPANIES.length} companies · ${SYNTH_ENDPOINT?'reasoning on':'retrieval only'} · live`;
  renderChips();
  // deep-link: meridian_ask.html?q=... (e.g. from the homepage search bar) auto-runs the question
  const _dq=new URLSearchParams(location.search).get('q');
  if(_dq && _dq.trim()){ document.getElementById('qHero').value=_dq; run(_dq.trim()); }
}
function renderChips(){
  const facts=["Tulisokibart","how many drugs target TL1A?","who is leading in TSLP?","when does spy002 read out?","duvakitug efficacy"];
  const think=["What matters most for a preclinical TL1A×IL-23p19 bispecific?","Is the TL1A space too crowded to enter?","Why would a bispecific beat a TL1A monotherapy?"];
  document.getElementById('heroChips').innerHTML =
    facts.map(q=>`<span class="chip" onclick="run('${J(q)}')">${q}</span>`).join('')+
    think.map(q=>`<span class="chip think" onclick="run('${J(q)}')">◇ ${q}</span>`).join('');
}

/* ---------- query understanding ---------- */
function resolveEntities(q){
  const hits=[],used=new Set();
  for(const s of SURFACES){
    const re=new RegExp("(?<![a-z0-9])"+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"(?![a-z0-9])","i");
    if(re.test(q)){ const e=NAME2ENT.get(s); if(!used.has(e.type+e.id)){ used.add(e.type+e.id); hits.push({...e,surface:s}); } }
  }
  return hits;
}
function targetTokensIn(q){
  const found=[], ts=tok(q), raw=q.toLowerCase();
  for(const t of TARGET_TOKENS){ if((ts.includes(t)||raw.includes(t)) && t.length>2 && !found.includes(t)) found.push(t); }
  return found.sort((a,b)=>b.length-a.length);
}
const MODALITY=/\bbispecific\b|\bbi-?specific\b|\bmonoclonal\b|\bmab\b|\bantibody\b|small molecule|\boral\b|\bvhh\b|nanobody|trispecific/i;
const STAGEWORD=/\bpreclinical\b|\bphase\s?[123]\b|\bphase\s?(i{1,3})\b|\bapproved\b|\bclinical\b|\bIND\b/i;
const REASON=/most important|what (should|matters|to consider)|\bconsider\b|\bshould i\b|\bwhy\b|how (do|would|should|can)|\bworst\b|\brisk\b|advantage|weakness|strength|\bstrateg|implication|trade-?off|too crowded|worth|recommend|\bbeat\b|differentiat/i;
const CMP=/\bvs\.?\b|\bversus\b|\bcompare\b|\bcompared\b|difference between|head.?to.?head|side.?by.?side/i;
const RANKQ=/\brank\b|\branked\b|best.?in.?class|\bhighest\b|\blowest\b|sort(ed)? by|order(ed)? by|leaderboard|which .*\b(highest|best|most|lowest|strongest)\b/i;
// "count" only means counting DRUGS/COMPANIES on a target — not "patient count", "cell count", etc.
const COUNT_SUBJ=/\b(drugs?|molecules?|assets?|programs?|compounds?|antibod\w*|bispecifics?|mabs?|companies|company|players?)\b/;
const TRIAL_ATTR=/\bpatients?\b|enroll|enrol(ment|led)|participants|sample\s*size|\bn\s*=|cohort size|patient count|cell count|blood count/;
function intent(q){
  const s=q.toLowerCase();
  if(/\b(how many|number of|count of)\b/.test(s) && COUNT_SUBJ.test(s) && !TRIAL_ATTR.test(s)) return 'count';
  if(/\blead(ing|er|ers)?\b|who('?s| is)?\s+(winning|ahead|leading|furthest)|furthest along|top (company|player|drug)/.test(s)) return 'leader';
  if(/completion date|read ?out|reports? out|when (will|does|is|do|are)|data (due|expected|coming)|topline|timeline|catalyst|pdufa|approval date|expected|milestone|finish|next (event|catalyst)/.test(s)) return 'timeline';
  if(/remission|efficac|response rate|endpoint|\bresults?\b|how effective|safety|tolerab|\bpk\b|pharmacokinet|half-?life|\bdata\b|\bada\b|immunogenic/.test(s)) return 'efficacy';
  if(/competitive landscape|competitor|compet(es|ing|ition)|who else|other (drugs|programs|assets|players)|\blandscape\b|players|\bfield\b|rivals/.test(s)) return 'landscape';
  return null;
}

/* ---------- helpers ---------- */
const STAGE_RANK=s=>{ s=(s||'').toLowerCase();
  if(/approv|market/.test(s))return 6; if(/phase 3|phase iii/.test(s))return 5; if(/phase 2|phase ii/.test(s))return 4;
  if(/phase 1|phase i\b/.test(s))return 3; if(/ind|clinical/.test(s))return 2; if(/preclin/.test(s))return 1; return 0; };
const coName=id=>(COMPANIES.find(c=>c.id===id)||{}).name||id;
const byTok=t=>DRUGS.filter(d=>tok(d.target).includes(t)||(d.target||'').toLowerCase().includes(t));
function byArchetype(tokens){ // drugs whose target contains ALL given tokens
  return DRUGS.filter(d=>{ const dt=(d.target||'').toLowerCase(); return tokens.every(t=>tok(d.target).includes(t)||dt.includes(t)); }); }

/* A bare entity name ("tulisokibart") is a lookup → dossier. The same entity inside a
   question ("how much did Sanofi pay for duvakitug") has residual meaning we can't answer
   structurally → research it. Question words/fillers are ignored; a substantive leftover
   token means it's a real question. */
const FILLER=new Set(['what','whats','when','where','who','whom','why','how','which','is','are','was','were','does','did','do','can','could','should','would','will','the','a','an','of','for','in','on','at','and','or','to','me','my','please','tell','show','give','about','info','information','details','detail','overview','profile','summary','get','find','want','need','know','much','many','it','this','that','their','its']);
function hasResidualQuestion(q, ents){
  let s=' '+q.toLowerCase()+' ';
  for(const e of (ents||[])){ if(e.surface) s=s.split(e.surface.toLowerCase()).join(' '); }
  return tok(s).some(t=>t.length>=3 && !FILLER.has(t));
}

/* ---------- typo tolerance: correct misspelled drug/company names ---------- */
let _correctNote='';
const NOCORRECT=new Set([...FILLER,'phase','study','trial','patient','patients','data','dose','dosing','result','results','remission','efficacy','safety','target','targets','company','companies','drug','drugs','landscape','competitive','competitor','approval','readout','partnership','partner','deal','deals','acquisition','enrollment','enrolled','mechanism','indication','market','revenue','price','cost','count','study','versus','phase2','phase3']);
function editDistance(a,b,max){
  const m=a.length,n=b.length; if(Math.abs(m-n)>max) return max+1;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; let best=i;
    for(let j=1;j<=n;j++){ const cost=a[i-1]===b[j-1]?0:1; const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost); cur[j]=v; if(v<best)best=v; }
    if(best>max) return max+1; prev=cur; }
  return prev[n];
}
function fuzzyCorrect(q){
  const parts=q.split(/(\s+)/), corr=[];
  for(let i=0;i<parts.length;i++){
    const t=parts[i].toLowerCase().replace(/[^a-z0-9-]/g,'');
    if(t.length<5 || NOCORRECT.has(t) || NAME2ENT.has(t)) continue;
    const budget=t.length<=6?1:2; let best=null,bestD=99;
    for(const s of SURFACES){ if(s.length<4||Math.abs(s.length-t.length)>budget||s[0]!==t[0]) continue;
      const d=editDistance(t,s,budget); if(d<bestD){bestD=d;best=s; if(d===0)break;} }
    if(best && bestD>0 && bestD<=budget && bestD/t.length<=0.34){ corr.push({from:t,to:best}); parts[i]=parts[i].replace(/[a-z0-9-]+/i,best); }
  }
  return {q2:parts.join(''),corrections:corr};
}

/* ---------- the net: surround any answer with adjacent answers we already hold ---------- */
async function cacheBatch(questions){
  if(!SYNTH_ENDPOINT||!questions.length) return null;
  try{ const r=await fetch(SYNTH_BASE+'/cache-batch',{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({questions})}); return r.ok?(await r.json()).results||[]:null; }catch(e){ return null; }
}
const _answeredCard=r=>`<div class="conn" onclick="run('${J(r.question)}')"><div class="rel">⚡ answered</div><div class="ct">${escapeHtml(r.headline||r.question)}</div><div class="cs">${escapeHtml(r.question)}</div></div>`;
async function preAnswer(question){ // research + cache an adjacent question in the background
  if(!SYNTH_ENDPOINT) return;
  try{ await fetch(SYNTH_ENDPOINT,{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({question,bundle:{prefetch:true},entities:entsPayload(question)})}); }catch(e){}
}
async function fillNet(q, prefetch=true){
  const el=document.getElementById('netSlot'); if(!el) return;
  const ents=resolveEntities(q), drug=ents.find(e=>e.type==='drug'), comp=ents.find(e=>e.type==='company'), ent=drug||comp;
  if(!ent) return;
  const name=(ent.label||'').split('(')[0].trim();
  const cand = drug
    ? [`${name} efficacy data`,`competitive landscape for ${name}`,`when does ${name} read out?`,`${name} safety profile`,`${name} mechanism of action`,`what deals involve ${name}?`,`who develops ${name}?`]
    : [`what is ${name} leading in?`,`${name} pipeline`,`${name} recent deals`,`${name} competitive position`];
  const qn=norm(q), list=cand.filter(c=>norm(c)!==qn);
  const res=await cacheBatch(list); if(!res) return;
  const ans=res.filter(r=>r.hit), open=res.filter(r=>!r.hit);
  if(!ans.length && !open.length) return;
  const top=(prefetch && open.length)?open[0]:null, rest=top?open.slice(1):open;
  el.innerHTML=`<div class="card"><h3>More in this space${ans.length?` <span class="src">· ${ans.length} answered</span>`:''}</h3>
    ${ans.map(_answeredCard).join('')}
    ${top?`<div class="conn" style="opacity:.85"><div class="rel"><span class="dot"></span>researching…</div><div class="ct">${escapeHtml(top.question)}</div><div class="cs">auto-answering this for you</div></div>`:''}
    ${rest.length?`<div class="followups" style="margin-top:${(ans.length||top)?'10px':'2px'}">${rest.map(r=>`<span class="chip" onclick="run('${J(r.question)}')">${escapeHtml(r.question)}</span>`).join('')}</div>`:''}</div>`;
  if(top){ preAnswer(top.question).then(()=>fillNet(q,false)); }   // one pre-answer per search; refresh without re-prefetching
}

/* ---------- main router ---------- */
async function answer(q){
  const ents=resolveEntities(q), it=intent(q), tts=targetTokensIn(q);
  const drug=ents.find(e=>e.type==='drug'), company=ents.find(e=>e.type==='company');
  const wantsReason=REASON.test(q);
  const isArchetype = !drug && (tts.length>=1) && (MODALITY.test(q)||STAGEWORD.test(q)||tts.length>=2) && (wantsReason||MODALITY.test(q));
  const drugs=ents.filter(e=>e.type==='drug');

  // COMPARISON & RANKING (structured + scannable) — win before the synthesis auto-route
  if(drugs.length>=2 && (CMP.test(q) || !hasResidualQuestion(q,ents))){ await comparisonAnswer(q,drugs); return 'comparison'; }
  if(RANKQ.test(q) && (tts.length||(drug&&drug.row.target))){ const t=tts[0]||tok(drug.row.target)[0]; const metric=/remission|efficac|response/i.test(q)?'efficacy':'stage'; await rankAnswer(q,t,metric); return 'ranking'; }

  // JUDGMENT / archetype / open reasoning -> synthesis (auto; logged server-side)
  if(SYNTH_ENDPOINT && (isArchetype || (wantsReason && (drug||company||tts.length)) || (wantsReason && !it))){
    await reasoningAnswer(q, {ents,drug,company,tts,isArchetype}); return 'synthesis';
  }

  // structured fast paths (logged client-side)
  if(it==='count' && (tts.length||(drug&&drug.row.target))){ const t=tts[0]||tok(drug.row.target)[0]; countAnswer(q,t,byTok(t).sort((a,b)=>STAGE_RANK(b.stage)-STAGE_RANK(a.stage))); return 'count'; }
  if(it==='leader' && (tts.length||drug)){ const t=tts[0]||tok(drug.row.target)[0]; leaderAnswer(q,t,byTok(t).sort((a,b)=>STAGE_RANK(b.stage)-STAGE_RANK(a.stage))); return 'leader'; }
  if(it==='efficacy' && drug){ await efficacyAnswer(q,drug); return 'efficacy'; }
  if(it==='timeline' && drug){ const c=await sb("catalysts",`select=label,catalyst_date,sort_date,catalyst_type,significance,source_url,outcome_text,catalyst_status&drug_id=eq.${enc(drug.id)}&order=sort_date`); timelineAnswer(q,drug,c); return 'timeline'; }
  if(it==='landscape' && drug){ landscapeAnswer(q,drug,await peripheryEdges(drug.id)); return 'landscape'; }
  if(it==='landscape' && tts.length){ const t=tts[0]; countAnswer(q,t,byTok(t).sort((a,b)=>STAGE_RANK(b.stage)-STAGE_RANK(a.stage)),true); return 'landscape'; }
  // a QUESTION that mentions an entity but matched no structured handler -> research it
  const asksMore = hasResidualQuestion(q, ents);
  if((drug||company||tts.length) && asksMore && SYNTH_ENDPOINT){ await reasoningAnswer(q,{ents,drug,company,tts,isArchetype:false}); return 'synthesis'; }
  // bare entity lookups -> dossier / company / target list
  if(drug){ dossierAnswer(q,drug,await peripheryEdges(drug.id)); return 'dossier'; }
  if(company){ companyAnswer(q,company); return 'company'; }
  if(tts.length){ countAnswer(q,tts[0],byTok(tts[0]).sort((a,b)=>STAGE_RANK(b.stage)-STAGE_RANK(a.stage)),true); return 'landscape'; }

  // no entity at all -> research it. Every question gets a path to an answer.
  if(SYNTH_ENDPOINT){ await reasoningAnswer(q,{ents,drug,company,tts,isArchetype:false}); return 'synthesis'; }
  fallbackAnswer(q); return 'unresolved';
}
/* fire-and-forget log of structured/unresolved questions (synthesis logs itself server-side) */
function logQuestion(q,route){
  if(!LOG_ENDPOINT) return;
  try{ fetch(LOG_ENDPOINT,{method:'POST',headers:ASK_HEADERS,
    body:JSON.stringify({question:q,route,resolution:route==='unresolved'?'unresolved':'structured',answered:route!=='unresolved',entities:entsPayload(q)})}).catch(()=>{}); }catch(e){}
}

/* ---------- graph + resources ---------- */
async function peripheryEdges(id){
  // Read the canonical de-duplicated view (symmetric COMPETES_WITH collapsed to one row per pair).
  const rows=await sb("v_entity_edges_dedup",`select=subject_type,subject_id,predicate,object_type,object_id,rationale,source_url,confidence_level&or=(subject_id.eq.${enc(id)},object_id.eq.${enc(id)})&limit=120`);
  // Belt-and-suspenders: collapse to one card per (predicate, neighbor) in case of any residual.
  const seen=new Set(), out=[];
  for(const e of rows){ const isOut=e.subject_id===id;
    const o={pred:e.predicate,otherType:isOut?e.object_type:e.subject_type,otherId:isOut?e.object_id:e.subject_id,rationale:e.rationale,src:e.source_url,conf:e.confidence_level};
    const k=o.pred+'|'+o.otherType+'|'+o.otherId; if(o.otherId===id||seen.has(k)) continue; seen.add(k); out.push(o);
  }
  return out;
}
async function resourcesFor(id){ return sb("drug_sources",`select=claim_type,claim_value,source_url,source_domain,source_type&drug_id=eq.${enc(id)}&limit=14`); }
function entLabel(t,id){ if(t==='drug'){const d=DRUGS.find(x=>x.id===id);return d?(d.display_name||d.name):id;} if(t==='company')return coName(id); return id; }

/* ---------- SYNTHESIS ---------- */
async function buildReasonBundle(ctx){
  const {drug,company,tts}=ctx;
  const b={question_context:'meridian graph snapshot'};
  if(drug){ b.focus_drug=slim(drug.row); b.edges=await peripheryEdges(drug.id); b.resources=await resourcesFor(drug.id); }
  if(company){ b.focus_company=company.row; b.company_pipeline=DRUGS.filter(d=>d.company_id===company.id).map(slim); }
  if(tts.length){
    const cohort = tts.length>=2?byArchetype(tts):byTok(tts[0]);
    b.target_tokens=tts;
    b.cohort=cohort.map(slim);
    b.cohort_stage_breakdown=tally(cohort.map(d=>d.stage));
    b.mechanism_precedent=await sb("mechanism_precedent_map",`select=target,mechanism_class,approved_drugs_count,accepted_primary_endpoints,accepted_biomarkers,regulatory_precedent_level,bd_regulatory_note&or=(${tts.map(t=>`target.ilike.*${enc(t)}*`).join(',')})`);
    b.failure_precedent=await sb("drug_failure_cascade",`select=failed_drug_name,failure_type,mechanism,impact_direction,impact_rationale&or=(${tts.map(t=>`mechanism.ilike.*${enc(t)}*`).join(',')})&limit=8`);
    b.nonresponder_rationale=await sb("drug_nonresponder_profiles",`select=mechanism_class,nonresponder_rate_pct,escape_mechanism,combination_rescue_hypothesis,source_urls&or=(${tts.map(t=>`mechanism_class.ilike.*${enc(t)}*`).join(',')})&limit=5`);
    b.payer_bar=await sb("payer_tpp_criteria","select=tpp_dimension,minimum_acceptable,preferred_profile,biologic_advantage_claim,source_url&limit=5");
    b.patient_intelligence=await sb("indication_patient_intelligence","select=indication_name,unmet_need_narrative,biologic_nonresponse_rate,clinical_remission_benchmark&limit=2");
  }
  return b;
}
const slim=d=>({id:d.id,name:d.display_name||d.name,company:coName(d.company_id),stage:d.stage,target:d.target,indication:d.indication_short,thesis:d.differentiation_thesis,key_data:d.key_data,source_url:d.source_url});
const tally=a=>a.reduce((m,x)=>{x=x||'—';m[x]=(m[x]||0)+1;return m;},{});

async function reasoningAnswer(q,ctx){
  const {drug,company,tts}=ctx;
  // periphery preview while we think
  let side='';
  if(tts.length){ const cohort=tts.length>=2?byArchetype(tts):byTok(tts[0]);
    side=`<h4>Cohort in scope (${cohort.length})</h4>`+cohort.sort((a,b)=>STAGE_RANK(b.stage)-STAGE_RANK(a.stage)).slice(0,10).map(d=>`<div class="conn" onclick="run('${J(d.name)}')"><div class="rel">${escapeHtml(d.stage||'')}</div><div class="ct">${escapeHtml(d.display_name||d.name)}</div><div class="cs">${escapeHtml(coName(d.company_id))}</div></div>`).join(''); }
  else if(drug){ side=connCards(await peripheryEdges(drug.id),'Connections'); }
  shell({asked:q,tag:'Reasoned answer',tagCls:'reason',title:'Thinking it through…',centerHTML:'',sideHTML:side});
  const bundle=await buildReasonBundle(ctx);
  await streamSynth(q,bundle,'#synthSlot',true);  // types the answer in live (falls back if streaming unavailable)
  // after synth, restore title from the answer's first line handled in render
}
async function deepen(q,bundle,title){
  await streamSynth(q,bundle,'#synthSlot',false);  // stream the deeper read in live too
}
function startProgress(slot){
  const msgs=["searching the web for the latest…","reading the sources…","cross-checking against the graph…","composing a cited answer…","flagging any conflicting sources…"];
  let i=0; const paint=()=>{ slot.innerHTML=`<div class="card"><div class="loading"><span class="dot"></span>${msgs[Math.min(i,msgs.length-1)]}</div></div>`; i++; };
  paint(); const id=setInterval(paint,5000); return ()=>clearInterval(id);
}
async function callSynth(q,bundle,sel,isPrimary){
  const slot=document.querySelector(sel);
  const stop=startProgress(slot);
  try{
    const r=await fetch(SYNTH_ENDPOINT,{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({question:q,bundle,entities:entsPayload(q)})});
    const j=await r.json(); stop();
    renderSynth(slot,j,isPrimary);
  }catch(e){
    stop();
    slot.innerHTML=`<div class="card empty">Reasoning server not reachable. Start it with <code>python3 meridian_ask_synth.py</code> (or set <code>SYNTH_ENDPOINT</code>). The structured answer below still stands.<div class="synthnote">${escapeHtml(e.message)}</div></div>`;
    if(isPrimary) logQuestion(q,'unresolved');  // no question lost — queue it for the resolver
  }
}
async function streamSynth(q,bundle,sel,isPrimary){
  const slot=document.querySelector(sel); if(!slot) return;
  const stop=startProgress(slot); let started=false, acc='';
  try{
    const r=await fetch(SYNTH_BASE+'/ask-stream',{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({question:q,bundle,entities:entsPayload(q)})});
    if(!r.ok||!r.body) throw new Error('no stream');
    const reader=r.body.getReader(), dec=new TextDecoder(); let sse='';
    while(true){ const {done,value}=await reader.read(); if(done) break;
      sse+=dec.decode(value,{stream:true}); let i;
      while((i=sse.indexOf('\n\n'))>=0){ const block=sse.slice(0,i); sse=sse.slice(i+2);
        const ei=block.indexOf('\n'); if(ei<0) continue;
        const ev=block.slice(0,ei).replace(/^event:\s*/,'').trim(); let data; try{ data=JSON.parse(block.slice(ei+1).replace(/^data:\s*/,'')); }catch{ continue; }
        if(ev==='delta'){ if(!started){ stop(); started=true; slot.innerHTML=`<div class="card"><div class="synth-answer" id="streamProse"></div><div class="src" style="margin-top:8px"><span class="dot"></span>composing live…</div></div>`; }
          acc+=(data.text||''); const el=document.getElementById('streamProse'); if(el) el.textContent=acc; }
        else if(ev==='result'){ renderSynth(slot,data,isPrimary); }
        else if(ev==='error'){ throw new Error(data.message||'stream error'); }
      }
    }
    if(!started) throw new Error('no deltas');
  }catch(e){ stop(); if(!started){ return callSynth(q,bundle,sel,isPrimary); } }  // fall back only if streaming never started
}
function renderSynth(slot,j,isPrimary){
  if(isPrimary){ const h=document.querySelector('.answer-h'); if(h) h.textContent = j.headline || 'Reasoned answer'; }
  const badge = (j.cache?`<span class="pill good">⚡ served from cache · no re-search</span>`:'')
    + (j.harvested_count?`<span class="pill stage">＋${j.harvested_count} fact${j.harvested_count>1?'s':''} learned → staged for review</span>`:'')
    + (j.validation_status==='unverified'?`<span class="pill direct">unverified — not cached</span>`:'');
  const reason=(j.reasoning||[]).map(r=>{
    const m=String(r).match(/^\s*(FACT|JUDGMENT|JUDGEMENT|GAP|READ)\b[:\-—]?\s*/i);
    let cls='t-fact',lbl='FACT',txt=r;
    if(m){ const k=m[1].toUpperCase(); txt=r.slice(m[0].length); if(k.startsWith('JUDG')||k==='READ'){cls='t-judge';lbl='READ';} else if(k==='GAP'){cls='t-gap';lbl='GAP';} else {cls='t-fact';lbl='FACT';} }
    return `<li><span class="tag-lbl ${cls}">${lbl}</span>${escapeHtml(txt)}</li>`;
  }).join('');
  const cites=(j.citations||[]).filter(c=>c.url).map(c=>`<a class="res" href="${c.url}" target="_blank" rel="noopener"><div class="rt">${escapeHtml(c.title||'source')}</div><div class="rd">${escapeHtml((c.url||'').replace(/^https?:\/\//,'').split('/')[0])}</div></a>`).join('');
  const rel=(j.related||[]).map(x=>`<span class="chip think" onclick="run('${J(x)}')">◇ ${escapeHtml(x)}</span>`).join('');
  const ans=cleanProse(j.answer||'');
  const ansHtml = ans
    ? `<div class="card"><div class="synth-answer">${escapeHtml(ans)}</div></div>`
    : `<div class="card empty">No AI synthesis was returned this time — the structured answer below stands. Try again, or check the reasoning server.</div>`;
  const clar = (j.clarify && j.clarify.question)
    ? `<div class="card"><h3>To pin this down ↩</h3><div style="font-size:15px;color:#d6c2f5;margin-bottom:10px">${escapeHtml(j.clarify.question)}</div><div class="followups">${(j.clarify.options||[]).map(o=>`<span class="chip think" onclick="run('${J(o)}')">◇ ${escapeHtml(o)}</span>`).join('')}</div></div>`
    : '';
  const limHtml=(j.limits&&String(j.limits).trim())?`<div class="card"><h3>What we don't know yet</h3><div style="font-size:14px;color:#cdbd9a;line-height:1.6">${escapeHtml(j.limits)}</div></div>`:'';
  const ns=(j.next_steps||[]).filter(Boolean);
  const nextHtml=ns.length?`<div class="card"><h3>What we can still figure out</h3><div class="followups">${ns.map(x=>`<span class="chip think" onclick="run('${J(x)}')">◇ ${escapeHtml(x)}</span>`).join('')}</div></div>`:'';
  // ── trust layer: confidence from source quality/agreement, freshness, conflicts ──
  const srcs=(j.citations||[]).filter(c=>c.url);
  const domains=[...new Set(srcs.map(c=>(c.url||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]))];
  const PRIMARY=/\.gov(\/|$|:)|clinicaltrials|fda\.|ema\.europa|sec\.gov|ncbi|nih\.gov|pubmed|nejm|thelancet|jamanetwork|nature\.com|gi\.org|\bir\.|investor|press-release/i;
  const hasPrimary=srcs.some(c=>PRIMARY.test(c.url||''));
  const conflicts=(j.conflicts||[]).filter(c=>c&&c.point);
  const tier=(conflicts.length||domains.length<=1||!ans)?'low':((domains.length>=3&&hasPrimary)?'high':'med');
  const tLbl={high:'high confidence',med:'moderate confidence',low:'low confidence'}[tier], tCls={high:'good',med:'stage',low:'direct'}[tier];
  const asof=j.as_of?('as of '+new Date(j.as_of).toLocaleDateString()):'researched just now';
  const trust=ans?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center">
    <span class="pill ${tCls}">${tLbl}</span>
    <span class="pill">${srcs.length} source${srcs.length!==1?'s':''} · ${domains.length} domain${domains.length!==1?'s':''}</span>
    <span class="pill ${hasPrimary?'good':''}">${hasPrimary?'primary source ✓':'secondary only'}</span>
    <span class="pill">${asof}</span>${conflicts.length?`<span class="pill direct">⚠ sources disagree</span>`:''}</div>`:'';
  const conflictCard=conflicts.length?`<div class="card" style="border-color:#5e2733"><h3 style="color:#fb7185">⚠ Sources disagree — verify before acting</h3>${conflicts.map(c=>`<div style="margin-bottom:11px"><div style="color:#fff;font-weight:600;font-size:14px">${escapeHtml(c.point)}</div>${(c.positions||[]).map(p=>`<div class="cs" style="margin-top:3px">• <b>${escapeHtml(p.stance||'')}</b> <span class="src">— ${escapeHtml(p.source||'')}</span></div>`).join('')}</div>`).join('')}</div>`:'';
  slot.innerHTML=`
    ${badge?`<div style="margin-bottom:10px">${badge}</div>`:''}
    ${trust}

/* ---------- flow ---------- */
function article(w){ return /^[aeiou]/i.test((w||'').trim())?'an':'a'; }
function submitQ(e,where){ e.preventDefault(); const q=(document.getElementById(where==='top'?'qTop':'qHero').value||'').trim(); if(q)run(q); return false; }
async function run(q){
  document.getElementById('qTop').value=q; document.body.classList.add('answer');
  document.getElementById('canvas').innerHTML=`<div class="loading" style="padding-top:40px"><span class="dot"></span>searching…</div>`;
  try{
    // typo tolerance: correct misspelled drug/company names before resolving
    _correctNote=''; const fz=fuzzyCorrect(q);
    if(fz.corrections.length){ q=fz.q2; _correctNote=`Showing results for <b>${escapeHtml(q)}</b> — corrected ${fz.corrections.map(c=>`“${escapeHtml(c.from)}”→“${escapeHtml(c.to)}”`).join(', ')}`; }
    window._lastQ=q;  // for answer feedback
    // cache-first: a previously-resolved question is answered instantly & free (no LLM call)
    const cached=await cacheLookup(q);
    if(cached){ renderCachedAnswer(q,cached); fillNet(q).catch(()=>{}); return; }   // server logs the cache serve
    const route=await answer(q); if(route&&route!=='synthesis') logQuestion(q,route);
    fillNet(q).catch(()=>{});  // surround the answer with adjacent answers we already hold
  }catch(err){ document.getElementById('canvas').innerHTML=`<div class="card empty">Something broke: ${escapeHtml(err.message)}</div>`; console.error(err); }
}
async function cacheLookup(q){
  if(!SYNTH_ENDPOINT) return null;
  try{ const r=await fetch(SYNTH_ENDPOINT,{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({question:q,cache_only:true,allow_cache:true,entities:entsPayload(q)})});
    if(!r.ok) return null; const j=await r.json(); return (j&&!j.miss&&(j.answer||'').trim())?j:null; }catch(e){ return null; }
}
function renderCachedAnswer(q,j){
  shell({asked:q,tag:'Answer · from memory',tagCls:'reason',title:j.headline||'Answer',centerHTML:'',sideHTML:''});
  renderSynth(document.getElementById('synthSlot'), Object.assign({},j,{cache:true}), true);
}
async function sendFeedback(v){
  const q=window._lastQ; if(!q||!SYNTH_ENDPOINT) return;
  const row=document.getElementById('fbRow'); if(row) row.innerHTML='…';
  try{ await fetch(SYNTH_BASE+'/feedback',{method:'POST',headers:ASK_HEADERS,body:JSON.stringify({question:q,verdict:v})});
    if(row) row.innerHTML = v==='up' ? 'Thanks — noted 🙏' : `Flagged — this will be re-researched next time. <span class="chip think" onclick="run(window._lastQ)">↻ re-research now</span>`;
  }catch(e){ if(row) row.innerHTML='(feedback unavailable)'; }
}
function goHome(){ document.body.classList.remove('answer'); document.getElementById('qHero').value=''; document.getElementById('qHero').focus(); }
boot();
