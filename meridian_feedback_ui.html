<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Enrichment Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;background:#f1f5f9;color:#1e293b}

/* ── Header ── */
.hd{background:#0d1f38;color:white;padding:0 18px;height:44px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hd-brand{font-size:13px;font-weight:900;letter-spacing:-0.02em;color:white}
.hd-mark{font-size:16px;color:#a78bfa;margin-right:4px}
.hd-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.04em}
.hd-sep{width:1px;height:20px;background:rgba(255,255,255,0.12)}
.hd-spacer{flex:1}
.hd-stat{font-size:10px;color:rgba(255,255,255,0.5);font-weight:600}
.hd-stat span{color:#a78bfa;font-weight:800}
.hd-back{font-size:10px;font-weight:700;color:rgba(255,255,255,0.5);text-decoration:none;padding:4px 10px;border:1px solid rgba(255,255,255,0.15);border-radius:5px}
.hd-back:hover{color:white;border-color:rgba(255,255,255,0.4)}

/* ── Layout ── */
.layout{display:flex;height:calc(100vh - 44px)}

/* ── Queue panel (left) ── */
.queue{width:340px;flex-shrink:0;background:white;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden}
.queue-hd{padding:12px 14px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px}
.queue-title{font-size:10px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:0.05em;flex:1}
.queue-count{font-size:10px;font-weight:700;background:#f1f5f9;color:#64748b;border-radius:10px;padding:2px 8px}
.queue-filter{padding:8px 14px;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;flex-wrap:wrap}
.f-chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;border:1.5px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;transition:all 0.1s}
.f-chip:hover,.f-chip.active{background:#7c3aed;border-color:#7c3aed;color:white}
.queue-body{flex:1;overflow-y:auto}
.q-item{padding:10px 14px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background 0.1s}
.q-item:hover{background:#f8fafc}
.q-item.active{background:#f5f3ff;border-left:3px solid #7c3aed}
.q-item.reviewed{opacity:0.5}
.q-name{font-size:11px;font-weight:700;color:#1e293b;margin-bottom:2px}
.q-field{font-size:10px;font-weight:600;color:#64748b;margin-bottom:2px}
.q-value{font-size:10px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.q-meta{display:flex;gap:6px;margin-top:4px}
.q-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;text-transform:uppercase}
.badge-drug{background:#dbeafe;color:#1d4ed8}
.badge-company{background:#dcfce7;color:#16a34a}
.badge-score{background:#fef9c3;color:#854d0e}
.q-empty{padding:40px 16px;text-align:center;color:#94a3b8;font-size:12px}

/* ── Review panel (right) ── */
.review{flex:1;overflow-y:auto;background:#f8fafc;padding:20px;display:flex;flex-direction:column;gap:16px}
.review-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#94a3b8}
.review-empty-icon{font-size:40px;opacity:0.4}
.review-empty-text{font-size:13px;font-weight:600;color:#94a3b8}
.review-empty-sub{font-size:11px;color:#cbd5e1;text-align:center;max-width:280px}

/* ── Card ── */
.card{background:white;border-radius:10px;border:1px solid #e2e8f0;overflow:hidden}
.card-hd{padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px}
.card-title{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:0.04em;flex:1}
.card-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase}
.card-body{padding:16px}

/* ── Entity info ── */
.entity-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.entity-name{font-size:18px;font-weight:800;color:#0f172a;line-height:1.2}
.entity-type{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase}
.entity-id{font-size:10px;color:#cbd5e1;margin-left:auto}
.field-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}

/* ── Value display ── */
.value-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:13px;line-height:1.5;color:#1e293b;word-break:break-word}
.old-value-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;font-size:12px;color:#9a3412;margin-top:8px}
.old-value-label{font-size:9px;font-weight:700;text-transform:uppercase;color:#c2410c;margin-bottom:3px}

/* ── Meta grid ── */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meta-item{background:#f8fafc;border-radius:6px;padding:8px}
.meta-key{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.meta-val{font-size:11px;font-weight:600;color:#1e293b}

/* ── Action panel ── */
.action-panel{background:white;border-radius:10px;border:1px solid #e2e8f0;padding:16px}
.action-hint{font-size:10px;color:#94a3b8;margin-bottom:12px;text-align:center}
.action-hint kbd{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;font-family:monospace;font-size:10px;color:#475569}
.action-buttons{display:flex;gap:8px}
.action-btn{flex:1;padding:10px 8px;border:2px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.action-btn .key{font-size:14px;font-weight:900}
.action-btn.yes:hover,.action-btn.yes.active{background:#dcfce7;border-color:#16a34a;color:#15803d}
.action-btn.no:hover,.action-btn.no.active{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.action-btn.uncertain:hover,.action-btn.uncertain.active{background:#fef9c3;border-color:#ca8a04;color:#854d0e}
.action-btn.skip:hover,.action-btn.skip.active{background:#f1f5f9;border-color:#94a3b8;color:#475569}

/* ── Notes input (always visible) ── */
.notes-box{margin-top:12px}
.notes-box-label{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.notes-box-label .required-badge{background:#fee2e2;color:#b91c1c;border-radius:3px;padding:1px 5px;font-size:8px;display:none}
.notes-box-label .required-badge.show{display:inline}
.notes-box textarea{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:12px;resize:vertical;min-height:64px;font-family:inherit;box-sizing:border-box;transition:border-color 0.15s}
.notes-box textarea:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,0.1)}
.notes-box textarea.required-highlight{border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,0.15)}
.notes-submit-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.notes-hint{font-size:10px;color:#94a3b8;flex:1}
.correction-submit{padding:7px 16px;background:#7c3aed;color:white;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.correction-submit:hover{background:#6d28d9}
/* legacy — keep .correction-box hidden */
.correction-box{display:none}

/* ── Progress bar ── */
.progress-bar{background:#f1f5f9;border-radius:4px;height:4px;overflow:hidden;margin:0 14px 8px}
.progress-fill{background:#7c3aed;height:100%;border-radius:4px;transition:width 0.3s ease}

/* ── Feedback toast ── */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:100}
.toast.show{opacity:1}
.toast.yes{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.toast.no{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.toast.uncertain{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.toast.skip{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#94a3b8;font-size:12px}

/* ── Scrollbar ── */
.queue-body::-webkit-scrollbar{width:4px}
.queue-body::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
</style>
</head>
<body>

<div class="hd">
  <span class="hd-mark">◈</span>
  <span class="hd-brand">Meridian</span>
  <div class="hd-sep"></div>
  <span class="hd-sub">Enrichment Review</span>
  <div class="hd-spacer"></div>
  <div class="hd-stat">Session: <span id="hd-reviewed">0</span> reviewed</div>
  <div class="hd-sep"></div>
  <div class="hd-stat">Queue: <span id="hd-queue">0</span></div>
  <div class="hd-sep"></div>
  <a class="hd-back" href="index.html">← Dashboard</a>
</div>

<div class="layout">

  <!-- Queue panel -->
  <div class="queue">
    <div class="queue-hd">
      <div class="queue-title">Review Queue</div>
      <div class="queue-count" id="queue-count">0</div>
    </div>
    <div class="queue-filter">
      <button class="f-chip active" data-filter="all">All</button>
      <button class="f-chip" data-filter="drug">Drugs</button>
      <button class="f-chip" data-filter="company">Companies</button>
      <button class="f-chip" data-filter="unreviewed">Unreviewed</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="queue-body" id="queue-body">
      <div class="loading">Loading enrichment data...</div>
    </div>
  </div>

  <!-- Review panel -->
  <div class="review" id="review-panel">
    <div class="review-empty">
      <div class="review-empty-icon">⌨</div>
      <div class="review-empty-text">Select an item to review</div>
      <div class="review-empty-sub">Use Y / N / U / S keys after selecting an item. Queue sorted by review priority.</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://tghntyofptvfhmtchwcv.supabase.co';
// NOTE: Uses anon key for client-side. Service key must never be in client HTML.
// For local review tool that Kyle runs on his own machine, using service key is acceptable.
const SUPABASE_KEY = (function() {
  // Try to read from meta tag (set by server) or fall back to anon key
  const meta = document.querySelector('meta[name="sb-key"]');
  if (meta) return meta.content;
  // Anon key — read-only access for display, write needs RLS or service key
  return 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnaG50eW9mcHR2ZmhtdGNod2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzYxMTIsImV4cCI6MjA5NDYxMjExMn0.HlqBTdaVV2l3RcbT8l2OO-h7x3Ny8pB0rkpK3jqmJRc';
})();

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── State ───────────────────────────────────────────────────────────────────
let allItems = [];
let filteredItems = [];
let entityNameMap = {};   // entity_id → display name
let selectedIdx = -1;
let reviewedIds = new Set();
let sessionReviewed = 0;
let activeFilter = 'all';

// ── Boot ────────────────────────────────────────────────────────────────────
async function boot() {
  await loadEntityNames();
  await loadQueue();
  bindKeys();
  bindFilters();
}

async function loadEntityNames() {
  // Fetch drug names
  const { data: drugs } = await db.from('drugs').select('id,name').limit(500);
  if (drugs) drugs.forEach(d => entityNameMap[d.id] = d.name);
  // Fetch company names
  const { data: cos } = await db.from('companies').select('id,name').limit(500);
  if (cos) cos.forEach(c => entityNameMap[c.id] = c.name);
}

async function loadQueue() {
  // Correct column name is enriched_value (not field_value)
  const { data, error } = await db
    .from('enriched_field_log')
    .select('id,entity_type,entity_id,field_name,enriched_value,old_value,label_source,field_label,review_priority_score,review_queue_position,enriched_at,confidence_score,source_citation,model_name,enrichment_run_id')
    .order('review_priority_score', { ascending: false, nullsFirst: false })
    .order('enriched_at', { ascending: false })
    .limit(300);

  if (error) {
    console.error('EFL load error:', error);
    document.getElementById('queue-body').innerHTML =
      '<div class="q-empty">Error loading queue: ' + error.message + '</div>';
    return;
  }

  // Load already-reviewed items from kyle_reviews
  const { data: reviews } = await db
    .from('kyle_reviews')
    .select('entity_id,field_name')
    .limit(1000);
  if (reviews) {
    reviews.forEach(r => reviewedIds.add(r.entity_id + '::' + r.field_name));
  }

  allItems = data || [];
  document.getElementById('hd-queue').textContent = allItems.length;
  applyFilter(activeFilter);
}

function applyFilter(filter) {
  activeFilter = filter;
  if (filter === 'all') {
    filteredItems = [...allItems];
  } else if (filter === 'drug') {
    filteredItems = allItems.filter(i => i.entity_type === 'drug');
  } else if (filter === 'company') {
    filteredItems = allItems.filter(i => i.entity_type === 'company');
  } else if (filter === 'unreviewed') {
    filteredItems = allItems.filter(i => !reviewedIds.has(i.entity_id + '::' + i.field_name));
  }
  renderQueue();
  updateProgress();
}

function renderQueue() {
  const body = document.getElementById('queue-body');
  document.getElementById('queue-count').textContent = filteredItems.length;

  if (!filteredItems.length) {
    body.innerHTML = '<div class="q-empty">No items in queue.</div>';
    return;
  }

  body.innerHTML = filteredItems.map((item, idx) => {
    const name = entityNameMap[item.entity_id] || item.entity_id;
    const reviewed = reviewedIds.has(item.entity_id + '::' + item.field_name);
    const scoreLabel = item.review_priority_score
      ? `<span class="q-badge badge-score">P${Math.round(item.review_priority_score)}</span>`
      : '';
    const val = item.enriched_value ? String(item.enriched_value).slice(0, 60) + (item.enriched_value.length > 60 ? '…' : '') : '(empty)';
    return `<div class="q-item${reviewed ? ' reviewed' : ''}${idx === selectedIdx ? ' active' : ''}" onclick="selectItem(${idx})">
      <div class="q-name">${escHtml(name)}</div>
      <div class="q-field">${escHtml(item.field_name)}</div>
      <div class="q-value">${escHtml(val)}</div>
      <div class="q-meta">
        <span class="q-badge badge-${item.entity_type || 'drug'}">${item.entity_type || 'drug'}</span>
        ${scoreLabel}
        ${reviewed ? '<span class="q-badge" style="background:#f1f5f9;color:#94a3b8">Reviewed</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function updateProgress() {
  const total = filteredItems.length;
  const done = filteredItems.filter(i => reviewedIds.has(i.entity_id + '::' + i.field_name)).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function selectItem(idx) {
  selectedIdx = idx;
  renderQueue();
  renderReview(filteredItems[idx]);
}

function renderReview(item) {
  const panel = document.getElementById('review-panel');
  const name = entityNameMap[item.entity_id] || item.entity_id;
  const reviewed = reviewedIds.has(item.entity_id + '::' + item.field_name);

  const oldValueHtml = item.old_value
    ? `<div class="old-value-box">
        <div class="old-value-label">Previous Value</div>
        ${escHtml(item.old_value)}
      </div>`
    : '';

  const scoreHtml = item.review_priority_score != null
    ? `<div class="meta-item"><div class="meta-key">Priority Score</div><div class="meta-val">${item.review_priority_score}</div></div>`
    : '';

  const queuePosHtml = item.review_queue_position != null
    ? `<div class="meta-item"><div class="meta-key">Queue Position</div><div class="meta-val">#${item.review_queue_position}</div></div>`
    : '';

  panel.innerHTML = `
    <div class="card">
      <div class="card-hd">
        <div class="card-title">Entity</div>
        <span class="card-badge badge-${item.entity_type || 'drug'}">${item.entity_type || 'drug'}</span>
      </div>
      <div class="card-body">
        <div class="entity-row">
          <div class="entity-name">${escHtml(name)}</div>
          <div class="entity-id">${escHtml(item.entity_id)}</div>
        </div>
        <div class="field-label">${escHtml(item.field_name)}</div>
        <div class="value-box">${escHtml(item.enriched_value || '(no value)')}</div>
        ${oldValueHtml}
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <div class="card-title">Enrichment Metadata</div>
      </div>
      <div class="card-body">
        <div class="meta-grid">
          <div class="meta-item"><div class="meta-key">Model</div><div class="meta-val">${escHtml(item.model_name || 'unknown')}</div></div>
          <div class="meta-item"><div class="meta-key">Confidence</div><div class="meta-val">${item.confidence_score != null ? (item.confidence_score * 100).toFixed(0) + '%' : 'n/a'}</div></div>
          <div class="meta-item"><div class="meta-key">Label</div><div class="meta-val">${escHtml(item.field_label || 'pending')}</div></div>
          <div class="meta-item"><div class="meta-key">Label Source</div><div class="meta-val">${escHtml(item.label_source || 'pending')}</div></div>
          ${scoreHtml}
          ${queuePosHtml}
        </div>
        ${item.source_citation ? `<div style="margin-top:8px"><div class="meta-key">Source</div><div style="font-size:11px;color:#7c3aed;word-break:break-all;margin-top:3px"><a href="${escHtml(item.source_citation)}" target="_blank" rel="noopener">${escHtml(item.source_citation)}</a></div></div>` : ''}
      </div>
    </div>

    <div class="action-panel">
      <div class="action-hint">
        Press <kbd>Y</kbd> Correct &nbsp;·&nbsp; <kbd>N</kbd> Incorrect &nbsp;·&nbsp; <kbd>U</kbd> Uncertain &nbsp;·&nbsp; <kbd>S</kbd> Skip
      </div>
      <div class="action-buttons">
        <button class="action-btn yes" onclick="doAction('confirmed')"><span class="key">Y</span>Correct</button>
        <button class="action-btn no" onclick="doAction('corrected')"><span class="key">N</span>Incorrect</button>
        <button class="action-btn uncertain" onclick="doAction('uncertain')"><span class="key">U</span>Uncertain</button>
        <button class="action-btn skip" onclick="doAction('skipped')"><span class="key">S</span>Skip</button>
      </div>
      <div class="notes-box">
        <div class="notes-box-label">
          Note / Correction &nbsp;<span class="required-badge" id="notes-required-badge">Required for N</span>
        </div>
        <textarea id="notes-input" placeholder="Type a note, correction, or additional context… (optional for Y/U/S, required for N)"></textarea>
        <div class="notes-submit-row">
          <span class="notes-hint" id="notes-hint">Optional — press Y / U / S above to submit, or N then Submit below</span>
          <button class="correction-submit" id="notes-submit-btn" onclick="submitCorrection()" style="display:none">Submit Correction ↵</button>
        </div>
      </div>
      <div class="correction-box" id="correction-box" style="display:none"></div>
    </div>
  `;
}

// ── Actions ──────────────────────────────────────────────────────────────────
// Track pending action when N is pressed (waits for note submission)
let _pendingCorrectedAction = false;

function _getNote() {
  return (document.getElementById('notes-input')?.value || '').trim();
}

function _clearNote() {
  const el = document.getElementById('notes-input');
  if (el) el.value = '';
  const badge = document.getElementById('notes-required-badge');
  if (badge) badge.classList.remove('show');
  const btn = document.getElementById('notes-submit-btn');
  if (btn) btn.style.display = 'none';
  const hint = document.getElementById('notes-hint');
  if (hint) hint.textContent = 'Optional — press Y / U / S above to submit, or N then Submit below';
  const ta = document.getElementById('notes-input');
  if (ta) ta.classList.remove('required-highlight');
  _pendingCorrectedAction = false;
}

async function doAction(action) {
  if (selectedIdx < 0) return;
  const item = filteredItems[selectedIdx];
  const note = _getNote();

  if (action === 'corrected') {
    // N pressed — show submit button, require note
    _pendingCorrectedAction = true;
    const badge = document.getElementById('notes-required-badge');
    if (badge) badge.classList.add('show');
    const btn = document.getElementById('notes-submit-btn');
    if (btn) btn.style.display = '';
    const hint = document.getElementById('notes-hint');
    if (hint) hint.textContent = 'Type the correct value above, then click Submit';
    const ta = document.getElementById('notes-input');
    if (ta) { ta.focus(); ta.classList.add('required-highlight'); }
    return; // wait for submitCorrection()
  }

  _pendingCorrectedAction = false;
  await writeReview(item, action, note || null);
  advance(action);
}

async function submitCorrection() {
  if (selectedIdx < 0) return;
  const item = filteredItems[selectedIdx];
  const val = _getNote();
  if (!val) {
    const ta = document.getElementById('notes-input');
    if (ta) { ta.focus(); ta.classList.add('required-highlight'); }
    return;
  }

  // Write to correction_labels
  try {
    await db.from('correction_labels').insert({
      entity_type: item.entity_type || 'drug',
      entity_id: item.entity_id,
      field_name: item.field_name,
      model_output: item.enriched_value,
      correct_value: val,
      correction_source: 'kyle',
      error_type: 'wrong_value',
      error_severity: 'medium',
      fine_tune_use: true
    });
  } catch(e) { console.warn('correction_labels write:', e); }

  // Update enriched_field_log
  try {
    await db.from('enriched_field_log').update({
      field_label: 'corrected',
      label_source: 'kyle_correction',
      reviewed_at: new Date().toISOString(),
      reviewed_by: 'Kyle'
    }).eq('id', item.id);
  } catch(e) { console.warn('enriched_field_log update:', e); }

  await writeReview(item, 'corrected', val);
  advance('corrected');
}

async function writeReview(item, action, noteText) {
  // Write to kyle_reviews (positive label store)
  const reviewRow = {
    entity_type: item.entity_type || 'drug',
    entity_id: item.entity_id,
    field_name: item.field_name,
    field_value: item.enriched_value,
    enrichment_run_id: item.enrichment_run_id,
    action: action,
    reviewed_at: new Date().toISOString(),
    session_id: 'feedback-ui-' + new Date().toISOString().slice(0, 10),
    fine_tune_use: action !== 'skipped'
  };
  if (noteText) reviewRow.notes = noteText;
  await db.from('kyle_reviews').insert(reviewRow);
  _clearNote();

  // Update enriched_field_log label if not a skip
  if (action !== 'skipped') {
    const labelMap = { confirmed: 'accepted', uncertain: 'pending' };
    const label = labelMap[action] || action;
    await db.from('enriched_field_log').update({
      field_label: label,
      label_source: action === 'confirmed' ? 'kyle_acceptance' : 'kyle_correction',
      reviewed_at: new Date().toISOString(),
      reviewed_by: 'Kyle'
    }).eq('id', item.id);
  }

  reviewedIds.add(item.entity_id + '::' + item.field_name);
  sessionReviewed++;
  document.getElementById('hd-reviewed').textContent = sessionReviewed;
}

function advance(action) {
  showToast(action);
  updateProgress();
  renderQueue();

  // Auto-advance to next unreviewed item
  let next = selectedIdx + 1;
  while (next < filteredItems.length) {
    const item = filteredItems[next];
    if (!reviewedIds.has(item.entity_id + '::' + item.field_name)) break;
    next++;
  }
  if (next < filteredItems.length) {
    selectItem(next);
    // Scroll queue item into view
    const qItems = document.querySelectorAll('.q-item');
    if (qItems[next]) qItems[next].scrollIntoView({ block: 'nearest' });
  } else {
    selectedIdx = -1;
    document.getElementById('review-panel').innerHTML = `
      <div class="review-empty">
        <div class="review-empty-icon">✓</div>
        <div class="review-empty-text">Queue complete!</div>
        <div class="review-empty-sub">All visible items reviewed. Try switching filters or loading more.</div>
      </div>`;
  }
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(action) {
  const msgs = {
    confirmed: '✓ Marked correct',
    corrected: '✎ Correction saved',
    uncertain: '? Marked uncertain',
    skipped: '→ Skipped'
  };
  const toast = document.getElementById('toast');
  toast.textContent = msgs[action] || action;
  toast.className = 'toast show ' + (action === 'confirmed' ? 'yes' : action === 'corrected' ? 'no' : action === 'uncertain' ? 'uncertain' : 'skip');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ── Keyboard ─────────────────────────────────────────────────────────────────
function bindKeys() {
  // Ctrl+Enter inside the notes textarea → submit (correction if N pending, else confirmed)
  document.addEventListener('keydown', e => {
    if (e.target.id === 'notes-input') {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (_pendingCorrectedAction) { submitCorrection(); }
        else { doAction('confirmed'); }
      }
      return; // don't fire Y/N/U/S shortcuts while typing
    }
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (selectedIdx < 0) return;

    switch(e.key.toLowerCase()) {
      case 'y': e.preventDefault(); doAction('confirmed'); break;
      case 'n': e.preventDefault(); doAction('corrected'); break;
      case 'u': e.preventDefault(); doAction('uncertain'); break;
      case 's': e.preventDefault(); doAction('skipped'); break;
      case 'arrowdown': e.preventDefault();
        if (selectedIdx < filteredItems.length - 1) selectItem(selectedIdx + 1);
        break;
      case 'arrowup': e.preventDefault();
        if (selectedIdx > 0) selectItem(selectedIdx - 1);
        break;
      case 'escape':
        _clearNote();
        break;
    }
  });
}

// ── Filter chips ─────────────────────────────────────────────────────────────
function bindFilters() {
  document.querySelectorAll('.f-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.f-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.filter);
    });
  });
}

// ── Util ─────────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Start ─────────────────────────────────────────────────────────────────────
boot();
</script>
