name: Landscape Briefings

# Revives the landscape_briefings table (was seeded once, no scheduled producer).
# Regenerates a cited landscape narrative per core area. Weekly; --force refreshes.
on:
  schedule:
    - cron: "30 9 * * 0"   # Sunday 5:30 AM ET
  workflow_dispatch:
    inputs:
      area:
        description: "Single area id (blank = all core areas)"
        required: false
        default: ""

concurrency:
  group: landscape-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Generate landscape briefings
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          AREA="${{ github.event.inputs.area }}"
          if [ -n "$AREA" ]; then
            python src/meridian/products/generate_landscape_briefing.py --area "$AREA" --force
          else
            for a in tl1a ibd tslp il4ra igf1r fcrn tcell; do
              echo "=== briefing: $a ==="
              python src/meridian/products/generate_landscape_briefing.py --area "$a" --force || echo "  ($a failed, continuing)"
            done
          fi
