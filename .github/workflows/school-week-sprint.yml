name: School Week Intelligence Sprint

on:
  schedule:
    # Monday 9 PM ET — Company profile enrichment pass 1
    - cron: '0 1 * * 2'
    # Tuesday 9 PM ET — Mechanism + source_url enrichment
    - cron: '0 1 * * 3'
    # Wednesday 9 PM ET — 100Q intelligence seeding
    - cron: '0 1 * * 4'
    # Thursday 9 PM ET — Company profile enrichment pass 2
    - cron: '0 1 * * 5'
    # Friday 9 PM ET — Competitive scoring sweep + validation
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      day:
        description: 'Sprint day (monday/tuesday/wednesday/thursday/friday/all)'
        required: false
        default: 'all'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# Prevent overlapping sprint runs (Tue–Sat cron) from double-writing.
concurrency:
  group: school-week-sprint
  cancel-in-progress: false

jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Detect sprint day
        id: day
        run: |
          INPUT="${{ github.event.inputs.day }}"
          if [ -n "$INPUT" ]; then
            echo "day=$INPUT" >> $GITHUB_OUTPUT
          else
            # Map UTC day to sprint task
            DOW=$(date -u +%u)  # 1=Mon, 2=Tue, etc.
            case $DOW in
              2) echo "day=monday" >> $GITHUB_OUTPUT ;;
              3) echo "day=tuesday" >> $GITHUB_OUTPUT ;;
              4) echo "day=wednesday" >> $GITHUB_OUTPUT ;;
              5) echo "day=thursday" >> $GITHUB_OUTPUT ;;
              6) echo "day=friday" >> $GITHUB_OUTPUT ;;
              *) echo "day=monday" >> $GITHUB_OUTPUT ;;
            esac
          fi

      # ── MONDAY: Company profiles for 69 companies with NO profile ─────────
      - name: "Monday — Company profile enrichment batch 1 (tl1a + fcrn areas)"
        if: steps.day.outputs.day == 'monday' || steps.day.outputs.day == 'all'
        continue-on-error: true
        run: |
          echo "SPRINT: Company profiles for unenriched companies"
          python scripts/company_enrichment.py --area tl1a --skip-discovery
          python scripts/company_enrichment.py --area fcrn --skip-discovery
          python scripts/company_enrichment.py --area ibd --skip-discovery
          python src/meridian/scoring/write_ranking_snapshots.py

      # ── TUESDAY: Mechanism + source_url gaps ──────────────────────────────
      - name: "Tuesday — Mechanism detail + source_url enrichment"
        if: steps.day.outputs.day == 'tuesday' || steps.day.outputs.day == 'all'
        continue-on-error: true
        run: |
          echo "SPRINT: mechanism_detail and source_url backfill"
          python src/meridian/enrichment/molecule_enrichment.py --area tl1a
          python src/meridian/enrichment/molecule_enrichment.py --area ibd
          python src/meridian/enrichment/molecule_enrichment.py --area fcrn
          python scripts/ct_gov_sync.py --area tl1a

      # ── WEDNESDAY: 100Q intelligence seeding for Next Gen drugs ──────────
      - name: "Wednesday — 100Q intelligence seeding for top competitors"
        if: steps.day.outputs.day == 'wednesday' || steps.day.outputs.day == 'all'
        continue-on-error: true
        run: |
          echo "SPRINT: drug_intelligence_qa seeding for Next Gen bispecifics"
          python src/meridian/enrichment/drug_intelligence_researcher.py --area tl1a --limit 10
          python scripts/company_enrichment.py --area igf1r --skip-discovery
          python scripts/company_enrichment.py --area atopy --skip-discovery

      # ── THURSDAY: Company profiles pass 2 + validation tests ─────────────
      - name: "Thursday — Company profiles pass 2 + expand validation tests"
        if: steps.day.outputs.day == 'thursday' || steps.day.outputs.day == 'all'
        continue-on-error: true
        run: |
          echo "SPRINT: Company profiles second pass + validation expansion"
          python scripts/company_enrichment.py --area tslp --skip-discovery
          python scripts/company_enrichment.py --area il4ra --skip-discovery
          python src/meridian/validation/validate_ground_truth.py --write-results

      # ── FRIDAY: Competitive scoring + full validation + ranking ──────────
      - name: "Friday — Competitive scoring sweep + ranking snapshots"
        if: steps.day.outputs.day == 'friday' || steps.day.outputs.day == 'all'
        continue-on-error: true
        run: |
          echo "SPRINT: Full competitive scoring + ranking update"
          python src/meridian/scoring/write_ranking_snapshots.py
          python src/meridian/validation/validate_ground_truth.py --write-results
          python src/meridian/scoring/compute_coverage.py

      # ── DAILY: Always run after any sprint day ────────────────────────────
      - name: "Daily ranking snapshot"
        if: always()
        continue-on-error: true
        run: python src/meridian/scoring/write_ranking_snapshots.py || true
