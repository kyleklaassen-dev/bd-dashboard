name: Meridian Research

on:
  schedule:
    # 2:00 AM ET = 06:00 UTC daily — RSS intel scan + LLM extraction (Tier 2)
    # Runs AFTER nightly enrichment pipeline (04:00–04:50 UTC) to pick up new articles.
    # evening-update.yml retired 2026-05-21 (was a duplicate run at 02:30 UTC Mon–Sat).
    # 02:30 UTC slot reserved for future signal_monitor.py (Tier 1, heuristic, no LLM).
    - cron: "0 6 * * *"
  workflow_dispatch:   # allow manual trigger

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run research pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/research.py
