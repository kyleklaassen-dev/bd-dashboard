name: Meridian Writer

on:
  schedule:
    # 6:30 AM ET = 10:30 UTC (Mon–Sat) — runs after research pipeline
    - cron: "30 10 * * 1-6"
  workflow_dispatch:   # allow manual trigger

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and deploy Meridian HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_DEPLOY_TOKEN }}
          GITHUB_REPO:       kyleklaassen-dev/bd-dashboard
        run: python scripts/write_meridian.py
