name: Meridian Writer

on:
  # EVENT-DRIVEN (Wave 0): the Writer now sits at the END of the nightly chain —
  # Research → Source Verify → Content Verify → Score → Writer — so every Issue is
  # built on facts verified and scored THAT SAME NIGHT.
  workflow_run:
    workflows: ["Compute Landscape Dependency Scores"]
    types: [completed]
    branches: [main]
  schedule:
    # 6:30 AM ET = 10:30 UTC daily — TRUE fallback now: write_meridian.py skips
    # if today's Issue already exists (one Issue/day), so this only generates
    # when the Research→Writer chain didn't run.
    - cron: "30 10 * * *"
  workflow_dispatch:   # allow manual trigger (use --force / MERIDIAN_FORCE=1 to regenerate same-day)

concurrency:
  group: meridian-write
  cancel-in-progress: false

jobs:
  write:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and deploy Meridian HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_DEPLOY_TOKEN }}
          GITHUB_REPO:       kyleklaassen-dev/bd-dashboard
        run: python scripts/write_meridian.py
