name: Meridian Writer

on:
  workflow_run:
    workflows: ["Meridian Research"]
    types: [completed]
    branches: [main]
  schedule:
    # 6:30 AM ET = 10:30 UTC daily — fallback if Research didn't run
    - cron: "30 10 * * *"
  workflow_dispatch:   # allow manual trigger

jobs:
  write:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and deploy Meridian HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_DEPLOY_TOKEN }}
          GITHUB_REPO:       kyleklaassen-dev/bd-dashboard
        run: python scripts/write_meridian.py
