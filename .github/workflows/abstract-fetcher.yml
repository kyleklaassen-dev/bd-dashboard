name: Meridian Abstract Fetcher

on:
  schedule:
    # Daily 10:00 AM ET = 14:00 UTC — abstract and preprint sweep (literature lands daily)
    # Runs daily; pure PubMed + Europe PMC API calls.
    # Light-weight: no LLM, pure PubMed + Europe PMC API calls.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      drug:
        description: "Fetch abstracts for a specific drug name (optional)"
        required: false
        default: ""
      preprints:
        description: "Run preprint monitor only"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run — fetch but do not write to Supabase"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: abstract-fetcher
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  fetch-abstracts:
    name: "Fetch Abstracts & Preprints"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run abstract fetcher
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Meridian Abstract Fetcher ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          ARGS=""
          if [ -n "${{ github.event.inputs.drug }}" ]; then
            ARGS="$ARGS --drug ${{ github.event.inputs.drug }}"
          fi
          if [ "${{ github.event.inputs.preprints }}" = "true" ]; then
            ARGS="$ARGS --preprints"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python src/meridian/ingestion/abstract_fetcher.py $ARGS"
          python src/meridian/ingestion/abstract_fetcher.py $ARGS

      - name: Run preprint monitor (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Preprint Monitor ==="
          python src/meridian/ingestion/abstract_fetcher.py --preprints
