name: BD Recommender

# Revives the bd_recommendations table (was seeded once, no scheduled producer).
# Scores + frames the top BD targets. Weekly cadence to bound Anthropic API cost.
on:
  schedule:
    - cron: "0 9 * * 0"   # Sunday 5 AM ET
  workflow_dispatch:
    inputs:
      top:
        description: "How many companies to score"
        required: false
        default: "20"

concurrency:
  group: bd-recommender
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Generate BD recommendations
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scoring/bd_recommender.py --top ${{ github.event.inputs.top || '20' }}
