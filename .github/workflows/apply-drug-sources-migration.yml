name: Apply Drug Sources Migration (v37, one-shot)

# Trigger: manual only.
#
# PREREQUISITE: Apply migrations/v37_drug_sources.sql manually in the Supabase SQL editor first:
#   https://supabase.com/dashboard/project/tghntyofptvfhmtchwcv/sql/new
#
# This workflow seeds the 30 high-confidence source rows and updates drugs.data_confidence.
# Run once after the SQL is applied. Safe to re-run (idempotent inserts).

on:
  workflow_dispatch:

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Seed sources and update confidence scores
        env:
          SUPABASE_URL: https://tghntyofptvfhmtchwcv.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/apply_drug_sources_migration.py --seed-only
