name: Backfill ailux_angle — Watch Tier

# Manual trigger only. Never runs on push or schedule.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: |
          dry_run  → generate + print, zero DB writes (review the artifact first)
          preview  → generate + write to field_backfill_preview for human review
          commit   → read approved rows from field_backfill_preview, patch drugs.ailux_angle
        required: true
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - preview
          - commit
      tier:
        description: |
          1a → immunology-primary (FcRn, IL-4Rα, TSLP, IL-33, BAFF, TNF, JAK, OX40, complement …)
          1b → oncology-adjacent with autoimmune signal (CD20, BCMA, FcγRIIb …)
          2  → oncology-only + metabolic + remainder
          all → all tiers in one pass (use with caution)
        required: true
        default: '1a'
        type: choice
        options:
          - 1a
          - 1b
          - '2'
          - all
      max_drugs:
        description: 'Max drugs to process per run (safety cap)'
        required: true
        default: '30'
        type: number
      run_id_override:
        description: 'Override run_id (required for commit mode — must match the preview run_id)'
        required: false
        type: string

jobs:
  backfill:
    name: "ailux_angle — ${{ inputs.mode }} / Tier ${{ inputs.tier }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
          TIER: ${{ inputs.tier }}
          MAX_DRUGS: ${{ inputs.max_drugs }}
          RUN_ID: ${{ inputs.run_id_override }}
        run: python3 enrichment/backfill_ailux_angle_watch.py

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ailux-angle-${{ inputs.mode }}-tier${{ inputs.tier }}-${{ github.run_number }}"
          path: docs/ailux_angle_*.json
          retention-days: 30
