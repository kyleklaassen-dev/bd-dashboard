name: Apply SQL Migration

# Runs a SQL migration file against Supabase via psycopg2.
# Manual dispatch only — never scheduled.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path to SQL file relative to repo root (e.g. migrations/fix_company_areas_trigger.sql)'
        required: true
      dry_run:
        description: 'Print SQL without executing'
        type: boolean
        required: false
        default: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_PAT:         ${{ secrets.SUPABASE_PAT }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          FILE="${{ github.event.inputs.migration_file }}"
          # Extract project ref from URL (https://PROJECTREF.supabase.co)
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co.*||')
          echo "Project ref: $PROJECT_REF"
          echo "Migration file: $FILE"
          echo "--- SQL ---"
          cat "$FILE"
          echo "--- end SQL ---"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "DRY RUN — not executing"
            exit 0
          fi
          # Use Supabase Management API to execute SQL
          python3 -c "
import json, os, sys, urllib.request
sql = open('$FILE').read()
project_ref = '$PROJECT_REF'
pat = os.environ['SUPABASE_PAT']
url = f'https://api.supabase.com/v1/projects/{project_ref}/database/query'
data = json.dumps({'query': sql}).encode()
req = urllib.request.Request(url, data=data,
      headers={'Authorization': f'Bearer {pat}', 'Content-Type': 'application/json'},
      method='POST')
try:
    with urllib.request.urlopen(req) as r:
        body = json.loads(r.read())
        print('Migration applied successfully')
        if isinstance(body, list):
            for row in body: print(row)
        else:
            print(body)
except urllib.request.HTTPError as e:
    err = e.read().decode()
    print(f'HTTP {e.code}: {err}', file=sys.stderr)
    sys.exit(1)
"
