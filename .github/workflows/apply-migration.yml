name: Apply SQL Migration

# Runs a SQL migration file against Supabase via psycopg2.
# Manual dispatch only — never scheduled.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path to SQL file relative to repo root (e.g. migrations/fix_company_areas_trigger.sql)'
        required: true
      dry_run:
        description: 'Print SQL without executing'
        type: boolean
        required: false
        default: false

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_PAT:         ${{ secrets.SUPABASE_PAT }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="${{ github.event.inputs.migration_file }}"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/apply_sql_migration.py $ARGS
