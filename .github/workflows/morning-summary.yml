name: Morning Summary

on:
  schedule:
    - cron: '0 11 * * *'  # 7 AM ET (UTC-4 summer)
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run morning summary
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/morning_summary.py

      - name: Commit summary
        run: |
          git config user.email "meridian@ailux.bio"
          git config user.name "Meridian Bot"
          git add meridian_overnight_summary.txt
          git diff --staged --quiet || git commit -m "chore: morning summary $(date +%Y-%m-%d)"
          git push
