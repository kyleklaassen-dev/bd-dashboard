name: Morning Summary

on:
  workflow_run:
    workflows: ["Meridian Writer"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 11 * * *'  # 7 AM ET (UTC-4 summer) — fallback if Writer didn't run
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  summary:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the write-capable deploy token so the summary commit can push.
          # (workflow_run-triggered runs get a read-only default token → 403 on push.)
          token: ${{ secrets.GH_DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run morning summary
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python src/meridian/products/morning_summary.py

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-overnight-summary
          path: meridian_overnight_summary.txt
          retention-days: 30
