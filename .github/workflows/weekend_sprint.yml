name: Meridian Weekend Autonomous Sprint

# ══════════════════════════════════════════════════════════════════
# SCHEDULE — All times UTC (US ET = UTC-4 in summer)
#
# Friday night → Saturday → Sunday full continuous sprint:
#
#  Block A (Validation)   — Fri 9PM ET  (01:00 UTC Sat)
#  Block B1 (Enrichment)  — Fri 11PM ET (03:00 UTC Sat)
#  Block C1 (Relat.)      — Sat 3AM ET  (07:00 UTC Sat)
#  Block D1 (Synthesis)   — Sat 7AM ET  (11:00 UTC Sat)
#  Block E1 (QA)          — Sat 11AM ET (15:00 UTC Sat)
#  Block F1 (Reporting)   — Sat 1PM ET  (17:00 UTC Sat)
#  Block B2 (Enrich #2)   — Sat 3PM ET  (19:00 UTC Sat)
#  Block D2 (Synth #2)    — Sat 7PM ET  (23:00 UTC Sat)
#  Block E2 (QA #2)       — Sat 11PM ET (03:00 UTC Sun)
#  Block C2 (Relat. #2)   — Sun 3AM ET  (07:00 UTC Sun)
#  Block D3 (Synth #3)    — Sun 7AM ET  (11:00 UTC Sun)
#  Block E3 (QA Final)    — Sun 11AM ET (15:00 UTC Sun)
#  Block F2 (Final Report)— Sun 2PM ET  (18:00 UTC Sun)
#
# MANUAL DISPATCH: use workflow_dispatch to run any block on demand.
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # Block A — Friday 9 PM ET = Saturday 01:00 UTC
    - cron: "0 1 * * 6"
    # Block B (run 1) — Friday 11 PM ET = Saturday 03:00 UTC
    - cron: "0 3 * * 6"
    # Block C (run 1) — Saturday 3 AM ET = Saturday 07:00 UTC
    - cron: "0 7 * * 6"
    # Block D (run 1) — Saturday 7 AM ET = Saturday 11:00 UTC
    - cron: "0 11 * * 6"
    # Block E (run 1) — Saturday 11 AM ET = Saturday 15:00 UTC
    - cron: "0 15 * * 6"
    # Block F (run 1) — Saturday 1 PM ET = Saturday 17:00 UTC
    - cron: "0 17 * * 6"
    # Block B (run 2) — Saturday 3 PM ET = Saturday 19:00 UTC
    - cron: "0 19 * * 6"
    # Block D (run 2) — Saturday 7 PM ET = Saturday 23:00 UTC
    - cron: "0 23 * * 6"
    # Block E (run 2) — Saturday 11 PM ET = Sunday 03:00 UTC
    - cron: "0 3 * * 0"
    # Block C (run 2) — Sunday 3 AM ET = Sunday 07:00 UTC
    - cron: "0 7 * * 0"
    # Block D (run 3) — Sunday 7 AM ET = Sunday 11:00 UTC
    - cron: "0 11 * * 0"
    # Block E (run 3 / final) — Sunday 11 AM ET = Sunday 15:00 UTC
    - cron: "0 15 * * 0"
    # Block F (final) — Sunday 2 PM ET = Sunday 18:00 UTC
    - cron: "0 18 * * 0"

  workflow_dispatch:
    inputs:
      block:
        description: "Block to run (A | B | C | D | E | F)"
        required: true
        default: "A"
        type: choice
        options:
          - A
          - B
          - C
          - D
          - E
          - F
      dry_run:
        description: "Dry run — fetch and synthesize but do not write to Supabase"
        type: boolean
        required: false
        default: false
      phase:
        description: "Run a single phase only (e.g. A1, B3, F2). Leave blank for full block."
        required: false
        default: ""

# ══════════════════════════════════════════════════════════════════
# SHARED SETUP — reusable steps pattern
# ══════════════════════════════════════════════════════════════════

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ────────────────────────────────────────────────────────────────
  # BLOCK A — Validation & Schema
  # Trigger: Friday 9 PM ET (01:00 UTC Saturday)
  # ────────────────────────────────────────────────────────────────
  block-a:
    name: "Block A — Validation & Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 6') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'A')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block A — Validation & Schema
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block A ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block A"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

  # ────────────────────────────────────────────────────────────────
  # BLOCK B — Primary Enrichment (runs twice: Sat 3AM and Sat 3PM)
  # ────────────────────────────────────────────────────────────────
  block-b:
    name: "Block B — Primary Enrichment"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 3 * * 6' || github.event.schedule == '0 19 * * 6')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'B')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block B — Primary Enrichment
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block B ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block B"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

  # ────────────────────────────────────────────────────────────────
  # BLOCK C — Relationship & Intelligence Enrichment (runs twice)
  # Sat 3AM ET and Sun 3AM ET
  # ────────────────────────────────────────────────────────────────
  block-c:
    name: "Block C — Relationship Enrichment"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 7 * * 6' || github.event.schedule == '0 7 * * 0')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'C')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block C — Relationship Enrichment
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block C ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block C"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

  # ────────────────────────────────────────────────────────────────
  # BLOCK D — Intelligence Synthesis (runs three times)
  # Sat 7AM ET, Sat 7PM ET, Sun 7AM ET
  # ────────────────────────────────────────────────────────────────
  block-d:
    name: "Block D — Intelligence Synthesis"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 11 * * 6' ||
        github.event.schedule == '0 23 * * 6' ||
        github.event.schedule == '0 11 * * 0')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'D')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block D — Intelligence Synthesis
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block D ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block D"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

  # ────────────────────────────────────────────────────────────────
  # BLOCK E — QA Validation (runs three times)
  # Sat 11AM ET, Sat 11PM ET, Sun 11AM ET
  # ────────────────────────────────────────────────────────────────
  block-e:
    name: "Block E — QA Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 15 * * 6' ||
        github.event.schedule == '0 3 * * 0' ||
        github.event.schedule == '0 15 * * 0')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'E')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block E — QA Validation
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block E ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block E"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

  # ────────────────────────────────────────────────────────────────
  # BLOCK F — Reporting & Cleanup (runs twice)
  # Sat 1PM ET and Sun 2PM ET (final)
  # ────────────────────────────────────────────────────────────────
  block-f:
    name: "Block F — Reporting & Cleanup"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 17 * * 6' || github.event.schedule == '0 18 * * 0')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.block == 'F')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Block F — Reporting & Cleanup
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Meridian Weekend Sprint — Block F ==="
          echo "Schedule trigger: ${{ github.event.schedule }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CMD="python scripts/weekend_sprint.py --block F"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.phase }}" ]; then
              CMD="python scripts/weekend_sprint.py --phase ${{ github.event.inputs.phase }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          echo "Running: $CMD"
          $CMD

      - name: Configure git for sprint commit
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "Meridian Sprint Bot"
          git config user.email "meridian-bot@ailux.bio"

      - name: Push sprint outputs to main
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add NEXT_SESSION.md WEEKEND_SPRINT_LOG.md 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "Weekend sprint output: NEXT_SESSION.md + log [$(date +%Y-%m-%d)]"
          git push origin main || echo "Nothing to push (clean)"
