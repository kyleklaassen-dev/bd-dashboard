name: Meridian Homepage News

on:
  schedule:
    # 07:30 UTC daily — runs after research.py (06:00 UTC) and before write_meridian.py (10:30 UTC)
    # This slot is intentional: research enriches intel/catalysts first, then news fetches
    # fresh articles, then the morning briefing bundles both into Industry Insights.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — score and log but do not write to DB'
        required: false
        default: 'false'
        type: boolean
      no_claude:
        description: 'Skip Claude summary generation'
        required: false
        default: 'false'
        type: boolean
      since:
        description: 'Only fetch articles since YYYY-MM-DD (optional)'
        required: false
        default: ''
      limit:
        description: 'Cap total articles processed (0 = no cap)'
        required: false
        default: '0'

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch homepage news
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.no_claude }}" = "true" ]; then
            ARGS="$ARGS --no-claude"
          fi
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/fetch_homepage_news.py $ARGS
