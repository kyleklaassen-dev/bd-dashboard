name: Intelligence Pipeline

# ══════════════════════════════════════════════════════════════════
# PIPELINE SEQUENCE (per area):
#   Step 3 — ct_gov_sync.py     → ClinicalTrials.gov structured sync
#   Steps 1,4,5,6 — company_enrichment.py → Entity discovery, catalyst
#                                             generation, company enrichment,
#                                             deal intelligence
#   Step 7 — research_intelligence.py → Completeness scoring, trigger
#                                        detection, research queue update
#
# ct_gov_sync MUST run before company_enrichment so that trial records
# exist when company_enrichment generates catalysts from PCD dates.
# research_intelligence MUST run last — it audits the final state.
#
# ALL AREAS run nightly — each area gets its own scheduled run so they
# execute in parallel rather than sequentially. Schedule staggers by
# 10 minutes to avoid Anthropic API burst limits:
#   04:00 UTC — tl1a   (Mon–Sun)
#   04:10 UTC — tslp   (Mon–Sun)
#   04:20 UTC — il4ra  (Mon–Sun)
#   04:30 UTC — fcrn   (Mon–Sun)
#   04:40 UTC — igf1r  (Mon–Sun)
#   04:50 UTC — tcell  (Mon–Sun)
# Each run targets a single area and completes in ~30–90 min.
# Manual dispatch: any single area or "all".
# ══════════════════════════════════════════════════════════════════

on:
  # All 6 areas run nightly — staggered 10 min apart to avoid API bursts
  schedule:
    - cron: '0 4 * * *'    # tl1a   — 04:00 UTC daily
    - cron: '10 4 * * *'   # tslp   — 04:10 UTC daily
    - cron: '20 4 * * *'   # il4ra  — 04:20 UTC daily
    - cron: '30 4 * * *'   # fcrn   — 04:30 UTC daily
    - cron: '40 4 * * *'   # igf1r  — 04:40 UTC daily
    - cron: '50 4 * * *'   # tcell  — 04:50 UTC daily

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      area:
        description: 'Disease area to process (tl1a | tslp | il4ra | fcrn | igf1r | tcell | all)'
        required: true
        default: 'tl1a'
      company:
        description: 'IMPORTANT: Fill this to run ONE company only (e.g. abbvie, sanofi, spyre, mirador). Leave blank to run ALL companies in the area (slow + expensive).'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (fetch + synthesize but do not write to Supabase)'
        type: boolean
        required: false
        default: false
      skip_trial_sync:
        description: 'Skip ct_gov_sync.py step (use when trials are already fresh)'
        type: boolean
        required: false
        default: false

concurrency:
  group: company-enrichment-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  intelligence-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      # ──────────────────────────────────────────────────────────
      # SCHEDULED RUNS — all 6 areas, nightly, parallel
      # Each area is triggered by its own cron (staggered 10 min)
      # so all 6 run as parallel GitHub Actions jobs.
      # ──────────────────────────────────────────────────────────

      - name: "[Nightly] Determine scheduled area"
        if: github.event_name == 'schedule'
        id: area_select
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * *")   echo "area=tl1a"  >> $GITHUB_OUTPUT ;;
            "10 4 * * *")  echo "area=tslp"  >> $GITHUB_OUTPUT ;;
            "20 4 * * *")  echo "area=il4ra" >> $GITHUB_OUTPUT ;;
            "30 4 * * *")  echo "area=fcrn"  >> $GITHUB_OUTPUT ;;
            "40 4 * * *")  echo "area=igf1r" >> $GITHUB_OUTPUT ;;
            "50 4 * * *")  echo "area=tcell" >> $GITHUB_OUTPUT ;;
            *)             echo "area=tl1a"  >> $GITHUB_OUTPUT ;;
          esac

      - name: "[Nightly] Step 3 — CT.gov trial sync"
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Running CT.gov sync for area: ${{ steps.area_select.outputs.area }}"
          python scripts/ct_gov_sync.py --area ${{ steps.area_select.outputs.area }}

      - name: "[Nightly] Steps 1,4,5,6 — Intelligence pipeline"
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Running enrichment for area: ${{ steps.area_select.outputs.area }}"
          python scripts/company_enrichment.py --area ${{ steps.area_select.outputs.area }}

      - name: "[Nightly] Step 7 — Research intelligence audit"
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/research_intelligence.py --area ${{ steps.area_select.outputs.area }}

      - name: "[Nightly] Identity health check"
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python src/meridian/validation/identity_health_check.py --fail-on-orphans --fail-on-fuzzy-pending

      # ──────────────────────────────────────────────────────────
      # MANUAL DISPATCH — single area (non-"all")
      # ──────────────────────────────────────────────────────────

      - name: "[Manual] Step 3 — CT.gov trial sync (single area)"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area != 'all' &&
          github.event.inputs.skip_trial_sync != 'true'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--area ${{ github.event.inputs.area }}"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python scripts/ct_gov_sync.py $ARGS"
          python scripts/ct_gov_sync.py $ARGS

      - name: "[Manual] Steps 1,4,5,6 — Intelligence pipeline (single area)"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area != 'all'
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--area ${{ github.event.inputs.area }}"
          if [ -n "${{ github.event.inputs.company }}" ]; then
            ARGS="$ARGS --company ${{ github.event.inputs.company }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python scripts/company_enrichment.py $ARGS"
          python scripts/company_enrichment.py $ARGS

      - name: "[Manual] Step 7 — Research intelligence audit (single area)"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area != 'all'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--area ${{ github.event.inputs.area }}"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python scripts/research_intelligence.py $ARGS"
          python scripts/research_intelligence.py $ARGS

      - name: "[Manual] Identity health check (single area)"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area != 'all' &&
          github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python src/meridian/validation/identity_health_check.py --fail-on-orphans --fail-on-fuzzy-pending

      # ──────────────────────────────────────────────────────────
      # MANUAL DISPATCH — all areas loop
      # Runs each area sequentially: tl1a → tslp → il4ra → fcrn → igf1r → tcell
      # ──────────────────────────────────────────────────────────

      - name: "[Manual/All] Step 3 → Steps 1,4,5,6 → Step 7 — Full pipeline (all areas)"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area == 'all'
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          AREAS="tl1a tslp il4ra fcrn igf1r tcell"
          DRY_FLAG=""
          SKIP_TRIAL=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          if [ "${{ github.event.inputs.skip_trial_sync }}" == "true" ]; then
            SKIP_TRIAL="true"
          fi

          for AREA in $AREAS; do
            echo "════════════════════════════════════════"
            echo "  Processing area: $AREA"
            echo "════════════════════════════════════════"

            if [ "$SKIP_TRIAL" != "true" ]; then
              echo "  → Step 3: CT.gov trial sync"
              python scripts/ct_gov_sync.py --area $AREA $DRY_FLAG
            else
              echo "  → Step 3: SKIPPED (skip_trial_sync=true)"
            fi

            echo "  → Steps 1,4,5,6: Intelligence pipeline"
            python scripts/company_enrichment.py --area $AREA $DRY_FLAG

            echo "  → Step 7: Research intelligence audit"
            python scripts/research_intelligence.py --area $AREA $DRY_FLAG

            echo "  ✓ Area $AREA complete"
          done
          echo "════════════════════════════════════════"
          echo "  Full pipeline complete — all 6 areas"
          echo "════════════════════════════════════════"

      - name: "[Manual/All] Identity health check"
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.area == 'all' &&
          github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python src/meridian/validation/identity_health_check.py --fail-on-orphans --fail-on-fuzzy-pending

      - name: "Record next-gen ranking snapshots"
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Recording next-gen ranking snapshots to DB..."
          python src/meridian/scoring/write_ranking_snapshots.py
          echo "Ranking snapshots complete."
