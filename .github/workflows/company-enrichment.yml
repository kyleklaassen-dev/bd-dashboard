name: Company Enrichment Pipeline

on:
  # Runs nightly Mon–Sat at midnight ET = 04:00 UTC — after the 10:30 PM evening sweep completes
  schedule:
    - cron: '0 4 * * 1-6'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      area:
        description: 'Disease area to enrich (e.g. tl1a, tslp, il4ra, fcrn, igf1r, tcell)'
        required: true
        default: 'tl1a'
      company:
        description: 'Optional: company ID substring filter (e.g. sanofi)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (fetch + synthesize but do not write to Supabase)'
        type: boolean
        required: false
        default: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests

      - name: Run enrichment — TL1A (scheduled)
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/company_enrichment.py --area tl1a

      - name: Run enrichment — manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--area ${{ github.event.inputs.area }}"
          if [ -n "${{ github.event.inputs.company }}" ]; then
            ARGS="$ARGS --company ${{ github.event.inputs.company }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python scripts/company_enrichment.py $ARGS"
          python scripts/company_enrichment.py $ARGS
