name: Meridian Evidence Collectors

# Evidence source backfill pipeline.
# Runs every Saturday after abstract-fetcher (14:00 UTC) finishes.
# Calls scripts/evidence/backfill_sources.py which owns all orchestration logic.

on:
  schedule:
    - cron: "0 15 * * 6"   # Saturday 15:00 UTC (11:00 AM ET) — 1 h after abstract-fetcher
  workflow_dispatch:
    inputs:
      areas:
        description: "Space-separated drug areas (default: core immunology set)"
        required: false
        default: "tl1a il23p19 tslp il4ra fcrn igf1r a4b7"
      dry_run:
        description: "Dry run — fetch but do not write"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: evidence-collectors
  cancel-in-progress: false

jobs:
  backfill:
    name: "Evidence source backfill"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run evidence source backfill
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          AREAS="${{ github.event.inputs.areas || 'tl1a il23p19 tslp il4ra fcrn igf1r a4b7' }}"
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python -m scripts.evidence.backfill_sources --areas "$AREAS" $FLAG
