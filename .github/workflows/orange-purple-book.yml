name: Meridian Orange/Purple Book Refresh
# FDA Orange Book zip + Purple Book CSV -> EXISTING drug_patents / drug_exclusivity.
# File downloads (not REST), free, no LLM -> exempt from the Claude-API spend pause.
on:
  schedule:
    - cron: "0 15 5 * *"   # 5th of each month, 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch+parse but do not write"
        required: false
        default: "false"
        type: boolean
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh Orange/Purple Book
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python src/meridian/ingestion/refresh_orange_purple_book.py $ARGS
