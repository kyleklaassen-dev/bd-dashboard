name: Meridian Free Ingest (catalysts + BD Today)

# Keeps the catalyst feed and the BD Today card current WITHOUT any LLM cost.
# 1) Re-pulls ClinicalTrials.gov catalysts across the whole catalog (deterministic, free).
# 2) Promotes upcoming source-verified catalysts into catalyst_calendar so the dashboard
#    BD Today widget always shows the nearest real readouts/PDUFA dates.
# All steps free + idempotent. The HTML pages read Supabase live, so they reflect this immediately.

on:
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC — fresh catalysts before the morning
  workflow_dispatch:

concurrency:
  group: meridian-free-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Provision service key
        run: printf '%s' "${{ secrets.SUPABASE_SERVICE_KEY }}" > .supabase_service_key
      - name: Refresh ClinicalTrials.gov catalysts (whole catalog)
        run: python3 scripts/integrations/ctgov_catalysts.py --all --write --write-catalysts || echo "ctgov partial — non-fatal"
      - name: Sync upcoming catalysts into catalyst_calendar (BD Today)
        run: python3 scripts/sync_catalyst_calendar.py --apply
      - name: Recompute patient whitespace (North Star apex)
        run: python3 src/meridian/scoring/compute_patient_whitespace.py || echo "patient whitespace non-fatal"
      - name: Refresh Indication Priority card (live + curated overlay)
        run: python3 src/meridian/scoring/compute_indication_priority.py || echo "indication priority non-fatal"
      - name: Clean up
        if: always()
        run: rm -f .supabase_service_key
