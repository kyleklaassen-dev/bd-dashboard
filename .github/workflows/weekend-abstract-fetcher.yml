name: Meridian Abstract Fetcher

# Weekly abstract and preprint sweep.
# Default run (no flags): drug sweep (all Phase 2+ drugs) then preprint monitor.
# Calls scripts/abstracts/fetch_abstracts.py which owns all orchestration logic.

on:
  schedule:
    - cron: "0 14 * * 6"   # Saturday 14:00 UTC (10:00 AM ET)
  workflow_dispatch:
    inputs:
      drug:
        description: "Fetch abstracts for a specific drug name only (optional)"
        required: false
        default: ""
      preprints:
        description: "Run preprint monitor only"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run — fetch but do not write to Supabase"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: abstract-fetcher
  cancel-in-progress: false

jobs:
  fetch:
    name: "Fetch abstracts and preprints"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run abstract fetcher
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.drug }}" ]; then
            ARGS="$ARGS --drug ${{ github.event.inputs.drug }}"
          fi
          if [ "${{ github.event.inputs.preprints }}" = "true" ]; then
            ARGS="$ARGS --preprints"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m scripts.abstracts.fetch_abstracts $ARGS
