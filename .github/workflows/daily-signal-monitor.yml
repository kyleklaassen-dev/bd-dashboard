name: Signal Monitor

on:
  schedule:
    # Runs every 6 hours — 00:30, 06:30, 12:30, 18:30 UTC
    # 02:30 UTC reserved for signal_monitor per tiered architecture (P0-A)
    - cron: '30 2,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      area:
        description: 'Filter to area_id (optional)'
        required: false
        default: ''
      company:
        description: 'Filter to company_id (optional)'
        required: false
        default: ''
      since:
        description: 'Only items since this date YYYY-MM-DD (optional, default: 2 days ago)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — score and log but do not write to DB'
        required: false
        default: 'false'
        type: boolean

jobs:
  signal-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run signal monitor
        env:
          SUPABASE_URL: https://tghntyofptvfhmtchwcv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.area }}" ]; then
            ARGS="$ARGS --area ${{ github.event.inputs.area }}"
          fi
          if [ -n "${{ github.event.inputs.company }}" ]; then
            ARGS="$ARGS --company ${{ github.event.inputs.company }}"
          fi
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/signal_monitor.py $ARGS --verbose
