name: Meridian Preview (no deploy)

# One-off preview generation of a Meridian Issue using the current code, WITHOUT
# publishing. Runs scripts/dryrun_meridian.py --live, which calls the model but
# does NOT save the issue to Supabase and does NOT deploy to GitHub Pages. The
# generated HTML is uploaded as a build artifact (not web-served), to be fetched
# back for review. Manual trigger only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridian-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate preview issue (no Supabase save, no Pages deploy)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GH_DEPLOY_TOKEN }}
          GITHUB_REPO:          kyleklaassen-dev/bd-dashboard
        run: python scripts/dryrun_meridian.py --live

      - name: List outputs
        run: ls -la outputs/ || true

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meridian-preview
          path: |
            outputs/dryrun_issue_*.html
            outputs/dryrun_prompts_*.txt
            outputs/dryrun_feed_*.txt
          if-no-files-found: error
          retention-days: 7
