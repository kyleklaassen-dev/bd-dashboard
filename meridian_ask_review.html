<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian · Ask — Review</title>
<style>
  :root{--bg:#0a0e14;--panel:#121823;--panel2:#0f141d;--edge:#1f2937;--ink:#e7edf5;--ink-dim:#9aa7b8;--ink-faint:#5b6776;
    --accent:#5b9dff;--accent-soft:#1b2a44;--good:#34d399;--warn:#fbbf24;--hot:#fb7185;--gap:#c084fc;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:radial-gradient(1100px 600px at 50% -10%,#10192a,#0a0e14 55%);color:var(--ink);font-family:var(--sans)}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  header{padding:22px 26px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:740}h1 b{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 26px 80px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:12px 16px;min-width:120px}
  .stat .n{font-size:24px;font-weight:740;font-family:var(--mono)}
  .stat .l{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{font-size:13px;color:var(--ink-dim);background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:8px 15px;cursor:pointer}
  .tab.on{color:#04101f;background:var(--accent);border-color:var(--accent);font-weight:650}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:13px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:7px 9px;border-bottom:1px solid var(--edge)}
  td{padding:9px 9px;border-bottom:1px solid #161e2a;vertical-align:top}
  tr:hover td{background:#0e1622}
  .mono{font-family:var(--mono)}.num{font-family:var(--mono);color:#fff}
  .pill{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;border:1px solid var(--edge);background:#0c121c;color:var(--ink-dim)}
  .hot{color:var(--hot);border-color:#5e2733;background:#2a1116}.warm{color:var(--warn);border-color:#5a4718;background:#2a2110}
  .cold{color:var(--ink-faint)}.good{color:var(--good);border-color:#1d4a3a;background:#0c1f18}
  .res{color:var(--good)}.unres{color:var(--warn)}.refused{color:var(--ink-faint)}.error{color:var(--hot)}
  .btn{cursor:pointer;font-size:13px;font-weight:650;color:#04101f;background:var(--accent);border:none;border-radius:9px;padding:9px 15px}
  .btn.ghost{background:#1d1630;color:#cdb6ef;border:1px solid #3a2d52}
  .muted{color:var(--ink-faint);font-size:12px}.note{font-size:12px;color:var(--ink-faint);border:1px dashed var(--edge);border-radius:9px;padding:10px 12px;margin-top:8px;line-height:1.5}
  code{font-family:var(--mono);background:#0c121c;border:1px solid var(--edge);border-radius:5px;padding:1px 6px;font-size:12px;color:#cdb6ef}
  .hide{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#13203a;border:1px solid var(--accent);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Meridian <b>·</b> Ask — Review</h1>
  <span class="muted mono" id="conn">connecting…</span>
  <span style="flex:1"></span>
  <button class="btn ghost" onclick="research()">◇ Research next unanswered</button>
  <button class="btn" onclick="loadAll()">↻ Refresh</button>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <span class="tab on" data-t="backlog" onclick="tab('backlog')">Backlog</span>
    <span class="tab" data-t="attempts" onclick="tab('attempts')">Resolution history</span>
    <span class="tab" data-t="facts" onclick="tab('facts')">Harvested facts</span>
  </div>
  <div id="backlog"></div>
  <div id="attempts" class="hide"></div>
  <div id="facts" class="hide"></div>
</div>
<div id="toast"></div>
<script>
// Env-aware: localhost uses meridian_ask_synth.py; the live site uses the Edge Function.
const _REV_LOCAL=["localhost","127.0.0.1",""].includes(location.hostname);
const SERVER=_REV_LOCAL?"http://localhost:8787":"https://tghntyofptvfhmtchwcv.supabase.co/functions/v1/ask-synth";
const ASK_KEY="1rC5ZddlZvtxmEYRQtr6gszpSXweK_n_";  // shared-secret gate
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opts){ opts=opts||{}; opts.headers=Object.assign({'x-meridian-key':ASK_KEY},opts.headers||{}); const r=await fetch(SERVER+path,opts); return r.json(); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function tab(n){ ['backlog','attempts','facts'].forEach(x=>{document.getElementById(x).classList.toggle('hide',x!==n);
  document.querySelector(`.tab[data-t=${x}]`).classList.toggle('on',x===n);}); }

async function loadStats(){
  try{ const s=await api('/stats');
    document.getElementById('conn').textContent='● live';
    const byr=s.by_resolution||{}, hf=s.harvested_facts||{};
    const cells=[['Open backlog',s.open_backlog,'hot'],['Questions logged',s.questions_logged],
      ['Resolved',(byr.synthesized||0)+(byr.cache||0)],['Unresolved',byr.unresolved||0],
      ['Cache entries',s.cache_entries],['Cache hits',s.cache_hits_total],
      ['Facts proposed',hf.proposed||0],['Facts promoted',hf.promoted||0]];
    document.getElementById('stats').innerHTML=cells.map(c=>`<div class="stat"><div class="n" ${c[2]==='hot'&&c[1]?'style=color:var(--hot)':''}>${c[1]??0}</div><div class="l">${c[0]}</div></div>`).join('');
  }catch(e){ document.getElementById('conn').textContent='● server offline — run python3 meridian_ask_synth.py'; }
}
async function loadBacklog(){
  try{ const {backlog}=await api('/backlog');
    document.getElementById('backlog').innerHTML=`<div class="card"><h3>Unanswered questions — scored by demand × recency</h3>${
      backlog.length?`<table><tr><th>Tier</th><th>Score</th><th>Asked</th><th>Attempts</th><th>Last asked</th><th>Question</th></tr>${
      backlog.map(b=>`<tr><td><span class="pill ${b.tier}">${b.tier}</span></td><td class="num">${b.priority_score}</td><td class="num">${b.ask_count}</td><td class="num">${b.resolve_attempts}</td><td class="mono muted">${esc((b.last_asked||'').slice(0,10))}</td><td>${esc(b.question)}</td></tr>`).join('')}</table>`
      :'<div class="muted">Backlog empty — every asked question is answered or resolved. 🎉</div>'}
      <div class="note">“Research backlog now” runs the resolver over the top eligible questions: web research → resolve when sourced → cache the answer → harvest sourced facts. Every attempt is recorded under <b>Resolution history</b>.</div></div>`;
  }catch(e){}
}
async function loadAttempts(){
  try{ const {attempts}=await api('/attempts');
    document.getElementById('attempts').innerHTML=`<div class="card"><h3>Resolution history — every research attempt</h3>${
      attempts.length?`<table><tr><th>When</th><th>Outcome</th><th>Src</th><th>Harvested</th><th>By</th><th>Question</th></tr>${
      attempts.map(a=>`<tr><td class="mono muted">${esc((a.attempted_at||'').slice(0,16).replace('T',' '))}</td><td class="${a.outcome}">${esc(a.outcome)}</td><td class="num">${a.source_count}</td><td class="num">${a.harvested_count}</td><td class="muted mono">${esc(a.triggered_by||'')}</td><td>${esc(a.question)}</td></tr>`).join('')}</table>`
      :'<div class="muted">No resolution attempts yet.</div>'}</div>`;
  }catch(e){}
}
async function loadFacts(){
  try{ const {facts}=await api('/facts?status=proposed');
    const byDest={}; facts.forEach(f=>{(byDest[f.suggested_dest||'unmapped']=byDest[f.suggested_dest||'unmapped']||[]).push(f);});
    let html='';
    for(const dest in byDest){
      html+=`<div class="card"><h3>${esc(dest)} — ${byDest[dest].length} proposed</h3><table><tr><th>#</th><th>Subject</th><th>Metric</th><th>Value</th><th>When</th><th>Conf</th><th>Source</th></tr>${
        byDest[dest].map(f=>`<tr><td class="mono muted">${f.id}</td><td>${esc(f.subject_name)}</td><td class="mono">${esc(f.metric)}</td><td class="num">${esc(f.value_text||f.value_num||'')}</td><td class="muted">${esc(f.period||'')}</td><td>${esc(f.confidence||'')}</td><td><a href="${esc(f.source_url)}" target="_blank">${esc(f.source_domain||'↗')}</a></td></tr>`).join('')}</table>
        <div class="note">Promotion into <code>${esc(dest)}</code> is human-gated (keeps core tables governed). Review &amp; promote from the CLI:<br>
        <code>python3 scripts/ask_promote.py --dest ${esc(dest)} --all --approve</code> &nbsp;·&nbsp; reject: <code>python3 scripts/ask_promote.py --reject &lt;id&gt; --note "…"</code></div></div>`;
    }
    document.getElementById('facts').innerHTML = html || `<div class="card"><div class="muted">No proposed facts in the queue.</div></div>`;
  }catch(e){}
}
async function research(){
  toast('Researching backlog… (web search, ~30-60s each)');
  try{ const out=await api('/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:1,triggered_by:'manual'})});
    toast(`Attempted ${out.attempted}: `+(out.results||[]).map(r=>r.outcome).join(', ')||'none eligible'); loadAll();
  }catch(e){ toast('Resolver failed — is the server running?'); }
}
function loadAll(){ loadStats(); loadBacklog(); loadAttempts(); loadFacts(); }
loadAll();
</script>
</body>
</html>
