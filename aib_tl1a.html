<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian · Area Intelligence Brief — TL1A × IL-23p19</title>
<style>
  :root{
    --ink:#14274a; --slate:#475569; --mut:#64748b; --line:#d6deea; --bg:#f8fafc;
    --navy:#1a3f8f; --soft:#eef4fb; --zebra:#f5f8ff; --green:#15803d; --amber:#b45309;
    --red:#b91c1c; --gold:#9a6a00; --goldbg:#fff7e6; --redbg:#fef2f2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}
  .wrap{max-width:920px;margin:0 auto;padding:0 26px 80px}

  /* top bar: title band + controls */
  .band{background:linear-gradient(135deg,#1a3f8f,#2e6fb0);color:#fff;border-radius:0 0 12px 12px;
    padding:9px 22px;margin-bottom:14px;box-shadow:0 3px 14px rgba(26,63,143,.13);
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .band .wm{font-size:10.5px;font-weight:700;letter-spacing:.07em;opacity:.82}
  .band h1{margin:1px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .band .band-date{font-size:12.5px;opacity:.85;white-space:nowrap}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;color:var(--slate);padding:8px 18px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:all .12s}
  .seg button.on{background:var(--navy);color:#fff}
  .dl{margin-left:auto;display:flex;gap:8px}
  .dl a{font-size:12.5px;color:var(--navy);text-decoration:none;border:1px solid var(--line);
    background:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
  .dl a:hover{border-color:var(--navy)}
  .meta{font-size:12px;color:var(--mut);margin:2px 2px 16px}

  /* rendered doc */
  #doc h1.sec{font-size:20px;color:var(--navy);font-weight:700;margin:30px 0 10px;
    padding-bottom:6px;border-bottom:2px solid var(--line);letter-spacing:-.01em}
  #doc h2.sec{font-size:16.5px;color:var(--ink);font-weight:700;margin:20px 0 6px}
  #doc p{margin:0 0 11px}
  #doc strong{color:var(--ink)}
  #doc ol:not(.fn), #doc ul{margin:0 0 12px;padding-left:22px}
  #doc ol:not(.fn) li, #doc ul li{margin-bottom:5px}

  /* the cover paragraphs at top of fragment */
  #doc > p:first-child{font-weight:700;color:var(--navy);font-size:15px}

  /* tables */
  #doc table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:13.5px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);border-radius:8px;overflow:hidden}
  #doc table td{border:1px solid var(--line);padding:8px 11px;vertical-align:top;background:#fff}
  #doc table tr:first-child td{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
  #doc table tr:nth-child(even):not(:first-child) td{background:var(--zebra)}
  /* KPI strip */
  #doc table.kpi,#doc table.kpi td{box-shadow:none;border:1px solid var(--line)}
  #doc table.kpi tr:first-child td{background:var(--soft);color:var(--navy);text-align:center;border-color:var(--line)}
  #doc table.kpi td p:first-child{font-size:23px;font-weight:800;color:var(--navy);margin:0}
  #doc table.kpi td p:last-child{font-size:11.5px;color:var(--mut);margin:2px 0 0}
  /* callouts (single-cell tables) */
  #doc table.callout,#doc table.callout td{box-shadow:none;border:0;border-radius:10px}
  #doc table.callout td{background:var(--soft) !important;color:var(--ink);
    border-left:5px solid var(--navy) !important;padding:13px 16px;font-weight:400}
  #doc table.callout.gold td{background:var(--goldbg) !important;border-left-color:var(--gold) !important}
  #doc table.callout.red td{background:var(--redbg) !important;border-left-color:var(--red) !important}
  #doc table.callout tr:first-child td{color:var(--ink);font-weight:400}
  /* verdict colors (specific enough to beat #doc strong) */
  #doc .v-green,#doc strong.v-green{color:var(--green);font-weight:700}
  #doc .v-red,#doc strong.v-red{color:var(--red);font-weight:700}
  #doc .v-amber,#doc strong.v-amber{color:var(--amber);font-weight:700}
  /* epistemic tags */
  .tagF{color:var(--green);font-weight:700}.tagI{color:var(--navy);font-weight:700}
  .tagJ{color:var(--amber);font-weight:700}.tagP{color:var(--red);font-weight:700}
  /* footnotes */
  #doc .footnotes{margin-top:30px;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--mut)}
  #doc .footnotes li{margin-bottom:5px}
  #doc sup a{color:var(--navy);text-decoration:none;font-weight:600}
  #doc .footnote-back{text-decoration:none}
  .loading{padding:60px;text-align:center;color:var(--mut)}
  /* drug chips + canonical card popover */
  .drugchip{color:var(--navy);border-bottom:1.5px dotted #2e6fb0;cursor:pointer}
  .drugchip:hover{background:#e7eefb}
  #drugcard{position:fixed;z-index:9999;max-width:350px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(15,23,42,.24);display:none;font-size:13px;overflow:hidden}
  #drugcard .dc-head{background:linear-gradient(135deg,#1a3f8f,#2e6fb0);color:#fff;padding:11px 14px}
  #drugcard .dc-name{font-weight:700;font-size:15px}
  #drugcard .dc-sub{font-size:11.5px;opacity:.88;margin-top:2px}
  #drugcard .dc-body{padding:11px 14px}
  #drugcard .dc-row{display:flex;gap:8px;margin-bottom:5px}
  #drugcard .dc-k{color:var(--mut);min-width:58px;font-size:11.5px}
  #drugcard .dc-v{color:var(--ink);font-size:12.5px;font-weight:600}
  #drugcard .dc-sum{color:var(--slate);font-size:12px;line-height:1.45;margin-top:7px}
  #drugcard a{color:#1d4ed8;text-decoration:none}
  #drugcard .dc-close{float:right;cursor:pointer;opacity:.85;font-size:15px}
</style>
</head>
<body>
<div class="band">
  <div>
    <div class="wm">◆ THE MERIDIAN · AREA INTELLIGENCE BRIEF</div>
    <h1>TL1A × IL-23p19 in UC/CD</h1>
  </div>
  <div class="band-date">June 8, 2026</div>
</div>
<div class="wrap">
  <div class="controls">
    <div class="dl" style="margin-left:0">
      <a id="dl" href="AIB_TL1A_IL23p19_UC_v13.docx" download>↓ Download (Word)</a>
    </div>
  </div>
  <div class="meta" id="meta">Source-traced · every footnote links to the primary source (ClinicalTrials.gov, NEJM, Lancet Gastroenterology &amp; Hepatology, ECCO / DDW, company disclosures).</div>
  <div id="doc"><div class="loading">Loading brief…</div></div>
</div>

<script>
const DOC_SRC="aib_tl1a_v13.html";
const cache={};
// ---- drug-name canonical-card chips ----
const SBV="https://tghntyofptvfhmtchwcv.supabase.co";
const KEYV="sb_publishable_3GLfZ7b9Tjp9RFRcc4YZew_ov-fY7dI";
const DRUGS=["tulisokibart","afimkibart","duvakitug","SPY002","RO7837195","MT-251","XmAb412","XmAb942","ABBV-701","mirikizumab","risankizumab","guselkumab","ustekinumab","vedolizumab","upadacitinib","etrasimod","ozanimod","deucravacitinib","infliximab","adalimumab","obefazimod"];
const COMPANIES=["Merck","Roche","Sanofi","Teva","AbbVie","Pfizer","Spyre","Xencor","Mirador","Prometheus","Telavant","FutureGen","Eli Lilly","Johnson & Johnson","Bristol Myers Squibb","Boehringer Ingelheim","Zymeworks","LaNova","Simcere","Elpiscience","Biocad","Qyuns","Innovent"];
const ENT=DRUGS.map(d=>({n:d,k:'drug'})).concat(COMPANIES.map(c=>({n:c,k:'company'}))).sort((a,b)=>b.n.length-a.n.length);
const idcache={};
function _entRx(){return new RegExp("\\b("+ENT.map(e=>e.n.replace(/[-&]/g,m=>"\\"+m)).join("|")+")\\b","g");}
function _kindOf(n){var e=ENT.find(x=>x.n===n);return e?e.k:'drug';}
function wrapChips(root){
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!ENT.some(e=>n.nodeValue.indexOf(e.n)>=0))return NodeFilter.FILTER_REJECT;
    var p=n.parentNode;while(p&&p!==root){if(p.tagName==='A'||(p.classList&&p.classList.contains('drugchip')))return NodeFilter.FILTER_REJECT;p=p.parentNode;}
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let x;while(x=walk.nextNode())nodes.push(x);
  nodes.forEach(n=>{const s=n.nodeValue;const rx=_entRx();const frag=document.createDocumentFragment();let last=0,m;
    while(m=rx.exec(s)){if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const sp=document.createElement('span');sp.className='drugchip';sp.dataset.ent=m[1];sp.dataset.kind=_kindOf(m[1]);sp.textContent=m[1];frag.appendChild(sp);last=m.index+m[1].length;}
    if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag,n);});
  root.querySelectorAll('.drugchip').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();openCanonical(c.dataset.ent,c.dataset.kind,e.clientX,e.clientY);}));
}
async function _resolveId(name,kind){
  const key=kind+':'+name; if(idcache[key]!==undefined) return idcache[key];
  let id=null;
  try{const tbl=kind==='company'?'companies':'drugs';
    const r=await fetch(SBV+"/rest/v1/"+tbl+"?select=id,name&name=ilike."+encodeURIComponent("%"+name+"%")+"&limit=1",{headers:{apikey:KEYV,Authorization:"Bearer "+KEYV}});
    const j=await r.json(); id=j[0]?j[0].id:null;
  }catch(e){}
  idcache[key]=id; return id;
}
// Click a drug/company name → open the EXISTING canonical card in the dashboard (same-origin parent).
// Standalone (full-screen, no dashboard parent) → fall back to a compact card.
async function openCanonical(name,kind,x,y){
  const id=await _resolveId(name,kind);
  try{
    if(window.parent && window.parent!==window){
      if(kind==='company' && typeof window.parent.openCompanyEntityModal==='function'){ window.parent.openCompanyEntityModal(id||name,name,null); return; }
      if(kind==='drug' && typeof window.parent.openDrugEntityModal==='function'){ window.parent.openDrugEntityModal(id||name,name,null); return; }
    }
  }catch(e){}
  showMiniCard(name,kind,x,y);
}
async function showMiniCard(name,kind,x,y){
  let card=document.getElementById('drugcard');
  if(!card){card=document.createElement('div');card.id='drugcard';document.body.appendChild(card);card.addEventListener('click',e=>e.stopPropagation());}
  card.style.display='block';card.style.left=Math.min(x,window.innerWidth-360)+'px';card.style.top=Math.min(y+14,window.innerHeight-280)+'px';
  card.innerHTML='<div class="dc-body" style="color:#64748b">Loading '+name+'…</div>';
  const esc=s=>String(s==null?'':s).replace(/</g,'&lt;');
  const close='<span class="dc-close" onclick="document.getElementById(\'drugcard\').style.display=\'none\'">×</span>';
  if(kind==='company'){card.innerHTML='<div class="dc-head">'+close+'<div class="dc-name">'+esc(name)+'</div><div class="dc-sub">company · open the dashboard for the full card</div></div>';return;}
  let d=idcache['rec:'+name];
  if(d===undefined){try{const r=await fetch(SBV+"/rest/v1/drugs?select=name,company_id,partner_company,stage,target,drug_summary,source_url&name=ilike."+encodeURIComponent("%"+name+"%")+"&limit=1",{headers:{apikey:KEYV,Authorization:"Bearer "+KEYV}});const j=await r.json();d=j[0]||null;}catch(e){d=null;}idcache['rec:'+name]=d;}
  if(!d){card.innerHTML='<div class="dc-head">'+close+'<div class="dc-name">'+esc(name)+'</div><div class="dc-sub">not in the area catalog</div></div><div class="dc-body"><a href="https://clinicaltrials.gov/search?term='+encodeURIComponent(name)+'" target="_blank">Search ClinicalTrials.gov ↗</a></div>';return;}
  card.innerHTML='<div class="dc-head">'+close+'<div class="dc-name">'+esc(d.name)+'</div><div class="dc-sub">'+esc(d.company_id||'—')+(d.partner_company?' · partner '+esc(d.partner_company):'')+'</div></div>'+
   '<div class="dc-body"><div class="dc-row"><span class="dc-k">Stage</span><span class="dc-v">'+esc(d.stage)+'</span></div>'+
   '<div class="dc-row"><span class="dc-k">Target</span><span class="dc-v">'+esc(d.target)+'</span></div>'+
   (d.drug_summary?'<div class="dc-sum">'+esc(d.drug_summary).slice(0,260)+'…</div>':'')+
   (d.source_url?'<div style="margin-top:8px"><a href="'+d.source_url+'" target="_blank">Source ↗</a></div>':'')+'</div>';
}
document.addEventListener('click',function(){var c=document.getElementById('drugcard');if(c)c.style.display='none';});
const H1RE=/^(\d{1,2}\s·\s|The landscape in brief$|What makes an asset valuable here$|Sources$)/;

function enhance(root){
  // strip the fragment's leading cover paragraphs (band already shows title) — everything before the first table
  let n=root.firstElementChild;
  while(n && n.tagName==='P'){ const nx=n.nextElementSibling; n.remove(); n=nx; }
  // headings
  root.querySelectorAll(':scope > p').forEach(p=>{
    const t=p.textContent.trim();
    if(!t) return;
    if(H1RE.test(t)){ const h=document.createElement('h1'); h.className='sec'; h.innerHTML=p.innerHTML; p.replaceWith(h); return; }
    const short=t.length<=80, hasRef=p.querySelector('sup,a'), endsPunct=/[.:,]$/.test(t),
          isTag=/^\[/.test(t), words=t.split(/\s+/).length;
    if(short && !hasRef && !endsPunct && !isTag && words<=12 && /[A-Za-z]/.test(t)){
      const h=document.createElement('h2'); h.className='sec'; h.innerHTML=p.innerHTML; p.replaceWith(h);
    }
  });
  // tables: KPI, callouts, verdict colors
  root.querySelectorAll('table').forEach(tb=>{
    const rows=tb.querySelectorAll('tr'), cells=tb.querySelectorAll('td');
    const txt=tb.textContent;
    if(cells.length===1){ // callout
      tb.classList.add('callout');
      if(/Kill scenario|→ ~\$0|≈ ?\$0/.test(txt)) tb.classList.add('red');
      else if(/Verdict|Synthesis|Sharpest|testable conclusion|Bottom line/.test(txt)) tb.classList.add('gold');
      return;
    }
    if(rows.length===1 && cells.length>=4 && /US IBD patients|market/.test(txt)){ tb.classList.add('kpi'); }
    // verdict keyword colors
    cells.forEach(td=>{
      const s=td.textContent.trim();
      if(/^(Edge|Differentiated|Real edge|Strong[a-z ]*|First in-human bispecific PK)$/.test(s)) colorCell(td,'v-green');
      else if(/^(Weakness|Unproven|miss|< ?\$1B|reverts|Time-limited)$/.test(s)) colorCell(td, /Time-limited/.test(s)?'v-amber':'v-red');
      else if(/\$8-12B|\$10B\+/.test(s)) colorCell(td,'v-green');
    });
  });
  // tag colorize [F]/[I]/[J]/[P] inline
  root.querySelectorAll('p,h2,td,li').forEach(el=>{
    if(el.children.length && el.querySelector('table')) return;
    el.innerHTML=el.innerHTML
      .replace(/\[F\]/g,'<span class="tagF">[F]</span>')
      .replace(/\[I\]/g,'<span class="tagI">[I]</span>')
      .replace(/\[J\]/g,'<span class="tagJ">[J]</span>')
      .replace(/\[P\]/g,'<span class="tagP">[P]</span>');
  });
  const fns=root.querySelector('.footnotes ol'); if(fns) fns.classList.add('fn');
  // all source links open in a new tab
  root.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
  // drug & company names become clickable chips → open the canonical dashboard card
  try{ wrapChips(root); }catch(e){ console.warn('chips',e); }
}
function colorCell(td,cls){ const b=td.querySelector('strong')||td; b.classList.add(cls); }

async function load(){
  const doc=document.getElementById('doc');
  if(!cache.doc){
    try{ const r=await fetch(DOC_SRC); cache.doc=await r.text(); }
    catch(e){ doc.innerHTML='<div class="loading">Could not load the brief. '+e.message+'</div>'; return; }
  }
  doc.innerHTML=cache.doc;
  enhance(doc);
}
load();
</script>
</body>
</html>
