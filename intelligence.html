<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence — Ailux BD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;background:#f1f5f9;color:#1e293b}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.main{display:flex;flex:1;overflow:hidden}

/* ── Header ── */
.hd{background:#0d1f38;color:white;padding:0 18px;height:44px;display:flex;align-items:center;gap:14px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.1)}
.hd-brand{font-size:13px;font-weight:900;letter-spacing:-0.02em;color:white;display:flex;align-items:center;gap:7px}
.hd-brand-mark{font-size:16px;color:#a78bfa}
.hd-sep{width:1px;height:20px;background:rgba(255,255,255,0.12)}
.hd-sub{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.04em;text-transform:uppercase}
.hd-spacer{flex:1}
.hd-sort{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:rgba(255,255,255,0.5)}
.hd-sort select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;cursor:pointer}
.hd-back{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.5);text-decoration:none;padding:4px 10px;border:1px solid rgba(255,255,255,0.15);border-radius:5px;transition:all 0.15s}
.hd-back:hover{color:white;border-color:rgba(255,255,255,0.4)}

/* ── Filter bar ── */
.filter-bar{background:white;border-bottom:1px solid #e2e8f0;padding:0 14px;height:38px;display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.f-pill{font-size:10px;font-weight:800;padding:3px 10px;border-radius:12px;border:1.5px solid #e2e8f0;background:white;color:#64748b;cursor:pointer;white-space:nowrap;transition:all 0.12s;letter-spacing:0.03em}
.f-pill:hover{border-color:#7c3aed;color:#7c3aed}
.f-pill.active{background:#7c3aed;border-color:#7c3aed;color:white}
.f-pill.area-tl1a.active{background:#1a3f8f;border-color:#1a3f8f}
.f-pill.area-tslp.active{background:#0e7490;border-color:#0e7490}
.f-pill.area-il4ra.active{background:#7c3aed;border-color:#7c3aed}
.f-pill.area-igf1r.active{background:#b45309;border-color:#b45309}
.f-pill.area-fcrn.active{background:#15803d;border-color:#15803d}
.f-pill.area-tcell.active{background:#dc2626;border-color:#dc2626}
.f-sep{width:1px;height:18px;background:#e2e8f0;flex-shrink:0;margin:0 2px}
.f-count{font-size:10px;font-weight:700;color:#94a3b8;margin-left:auto;flex-shrink:0}

/* ── Roster panel (left) ── */
.roster-panel{width:360px;flex-shrink:0;background:white;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden}
.roster-body{flex:1;overflow-y:auto}
.roster-body::-webkit-scrollbar{width:4px}
.roster-body::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.roster-empty{padding:40px 16px;text-align:center;color:#94a3b8;font-size:12px}

/* ── Roster row ── */
.r-row{position:relative;padding:11px 14px 11px 17px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background 0.1s}
.r-row:hover{background:#f8fafc}
.r-row.active{background:#f5f3ff;border-left:3px solid #7c3aed}
.r-row.active.area-tl1a{background:#f0f4ff;border-left-color:#1a3f8f}
.r-row.active.area-tslp{background:#f0fbff;border-left-color:#0e7490}
.r-row.active.area-il4ra{background:#f5f3ff;border-left-color:#7c3aed}
.r-row.active.area-igf1r{background:#fffbf0;border-left-color:#b45309}
.r-row.active.area-fcrn{background:#f0fdf4;border-left-color:#15803d}
.r-row.active.area-tcell{background:#fff5f5;border-left-color:#dc2626}
.r-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.r-name{font-size:12.5px;font-weight:800;color:#0d1f38;line-height:1.2}
.r-area{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;padding:1px 5px;border-radius:3px;color:white;flex-shrink:0;margin-top:1px}
.r-summary{font-size:11px;color:#475569;line-height:1.45;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-summary.empty{color:#94a3b8;font-style:italic}
.r-row-foot{display:flex;align-items:center;gap:6px}
.r-drug{font-size:10px;font-weight:700;color:#1e40af;background:#eff6ff;border-radius:3px;padding:1px 6px;display:inline-flex;align-items:center;gap:4px}
.r-drug-stage{font-size:8.5px;font-weight:700;color:#6d28d9;background:#ede9fe;border-radius:2px;padding:0 4px}
.r-fresh{font-size:9.5px;color:#94a3b8;margin-left:auto;flex-shrink:0}
.r-fresh.fresh{color:#16a34a}
.r-fresh.stale{color:#f59e0b}
.r-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:1px}
.r-dot.strong{background:#22c55e}
.r-dot.partial{background:#f59e0b}
.r-dot.thin{background:#ef4444}
.r-dot.none{background:#e2e8f0}

/* ── Detail panel (right) ── */
.detail-panel{flex:1;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column}
.detail-panel::-webkit-scrollbar{width:5px}
.detail-panel::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:3px}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cbd5e1}

/* ── Detail header ── */
.det-hd{background:linear-gradient(135deg,#0d1f38 0%,#1a3f8f 100%);color:white;padding:20px 24px 16px;flex-shrink:0}
.det-hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.det-name{font-size:20px;font-weight:900;color:white;line-height:1.2}
.det-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.det-area{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;padding:2px 8px;border-radius:4px;color:white;border:1px solid rgba(255,255,255,0.3)}
.det-class{font-size:9px;font-weight:800;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9)}
.det-overlap{font-size:9px;font-weight:800;padding:2px 8px;border-radius:4px}
.det-overlap.direct{background:#fef2f2;color:#dc2626}
.det-overlap.adjacent{background:#fff7ed;color:#c2410c}

.det-overlap.watch{background:#fefce8;color:#a16207}
.det-score-strip{display:flex;align-items:center;gap:10px;margin-top:10px}
.det-score-num{font-size:22px;font-weight:900;color:white;line-height:1}
.det-score-label{font-size:10px;color:rgba(255,255,255,0.55);font-weight:600}
.det-score-bar{flex:1;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden}
.det-score-fill{height:100%;border-radius:3px;background:#4ade80;transition:width 0.5s ease}
.det-enriched{font-size:10px;color:rgba(255,255,255,0.45);font-weight:600}

/* ── Profile sections ── */
.det-profile{background:white;border-bottom:1px solid #f1f5f9;padding:18px 24px}
.det-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.det-profile-full{grid-column:1/-1}
.profile-block{}
.profile-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.07em;color:#94a3b8;margin-bottom:6px}
.profile-text{font-size:12px;color:#334155;line-height:1.6}
.profile-text.empty{color:#94a3b8;font-style:italic}
.vs-ailux-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:6px;padding:12px 14px;margin-top:8px}
.vs-ailux-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.07em;color:#7c3aed;margin-bottom:5px}
.vs-ailux-text{font-size:12px;color:#374151;line-height:1.6}
.risk-box{background:#fff8f0;border:1px solid #fed7aa;border-radius:6px;padding:12px 14px}
.risk-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.07em;color:#c2410c;margin-bottom:5px}
.risk-text{font-size:12px;color:#374151;line-height:1.6}

/* ── Section divider ── */
.det-section-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;padding:10px 24px 0;background:#f8fafc}

/* ── Expanders ── */
.expander{background:white;border-bottom:1px solid #f1f5f9}
.exp-hd{display:flex;align-items:center;gap:8px;padding:12px 24px;cursor:pointer;user-select:none;transition:background 0.1s}
.exp-hd:hover{background:#f8fafc}
.exp-toggle{font-size:10px;color:#94a3b8;transition:transform 0.2s;width:14px;flex-shrink:0}
.exp-toggle.open{transform:rotate(90deg)}
.exp-title{font-size:11.5px;font-weight:800;color:#1e293b}
.exp-count{font-size:9.5px;font-weight:700;background:#f1f5f9;color:#64748b;border-radius:10px;padding:1px 7px}
.exp-badge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px}
.exp-badge.green{background:#dcfce7;color:#15803d}
.exp-badge.amber{background:#fef3c7;color:#b45309}
.exp-badge.red{background:#fef2f2;color:#dc2626}
.exp-spacer{flex:1}
.exp-body{display:none;padding:0 24px 16px}
.exp-body.open{display:block}
.exp-empty{font-size:11px;color:#94a3b8;padding:8px 0;font-style:italic}

/* ── Data tables ── */
.data-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.data-table th{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;padding:4px 8px 6px;text-align:left;border-bottom:1px solid #f1f5f9}
.data-table td{padding:8px 8px;border-bottom:1px solid #f8fafc;color:#334155;vertical-align:top;line-height:1.5}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafbff}
.cell-muted{color:#94a3b8;font-style:italic}
.stage-pill{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:3px;display:inline-block;white-space:nowrap}
.ph-approved{background:#dcfce7;color:#15803d}
.ph-3{background:#dbeafe;color:#1d4ed8}
.ph-2{background:#ede9fe;color:#6d28d9}
.ph-1{background:#fef3c7;color:#92400e}
.ph-pre{background:#f1f5f9;color:#64748b}
.ph-disc{background:#f8fafc;color:#94a3b8}
.diff-text{font-size:10.5px;color:#475569;line-height:1.5;margin-top:3px}
.trial-status{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:3px;display:inline-block}
.trial-recruiting{background:#dcfce7;color:#15803d}
.trial-active{background:#dbeafe;color:#1d4ed8}
.trial-completed{background:#f1f5f9;color:#475569}
.trial-other{background:#fef3c7;color:#92400e}
.deal-tag{font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:3px;display:inline-block;background:#ede9fe;color:#6d28d9}
.intel-item{padding:8px 0;border-bottom:1px solid #f8fafc;display:flex;gap:10px}
.intel-item:last-child{border-bottom:none}
.intel-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;margin-top:4px}
.intel-content{flex:1}
.intel-title{font-size:11.5px;color:#1e293b;line-height:1.4;font-weight:600}
.intel-angle{font-size:11px;color:#475569;line-height:1.5;margin-top:3px;padding:6px 8px;background:#f0fdf4;border-left:2px solid #4ade80;border-radius:0 4px 4px 0}
.intel-meta{font-size:9.5px;color:#94a3b8;margin-top:3px}

/* ── Gap section ── */
.gaps-section{background:#fafafa;border-bottom:1px solid #f1f5f9}
.gaps-hd{display:flex;align-items:center;gap:8px;padding:10px 24px;cursor:pointer;user-select:none}
.gaps-hd:hover{background:#f5f5f5}
.gaps-toggle{font-size:10px;color:#cbd5e1;transition:transform 0.2s;width:14px}
.gaps-toggle.open{transform:rotate(90deg)}
.gaps-title{font-size:10.5px;font-weight:700;color:#94a3b8}
.gaps-count{font-size:9px;font-weight:700;background:#fef2f2;color:#dc2626;border-radius:10px;padding:1px 7px}
.gaps-body{display:none;padding:0 24px 14px}
.gaps-body.open{display:block}
.gap-stage-group{margin-bottom:10px}
.gap-stage-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.gap-bar-wrap{flex:1;height:3px;background:#f1f5f9;border-radius:2px;overflow:hidden}
.gap-bar-fill{height:100%;border-radius:2px;background:#22c55e}
.gap-chip{display:inline-block;font-size:9px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:3px;padding:1px 5px;margin:2px 2px 0 0}

/* ── Loading states ── */
.loading-pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.skeleton{background:#f1f5f9;border-radius:4px;height:12px;margin-bottom:6px}
.skeleton.w60{width:60%}
.skeleton.w80{width:80%}
.skeleton.w40{width:40%}
</style>
</head>
<body>
<div class="app">

<!-- Header -->
<div class="hd">
  <div class="hd-brand"><span class="hd-brand-mark">◈</span> Intelligence</div>
  <div class="hd-sep"></div>
  <div class="hd-sub">Competitive Dossier</div>
  <div class="hd-spacer"></div>
  <div class="hd-sort">
    Sort:
    <select id="sort-select" onchange="applySort(this.value)">
      <option value="enriched">Recently Enriched</option>
      <option value="complete">Most Complete</option>
      <option value="alpha">Alphabetical</option>
      <option value="priority">Priority Score</option>
    </select>
  </div>
  <div class="hd-sep"></div>
  <a href="index.html" class="hd-back">← Dashboard</a>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <button class="f-pill active" onclick="setArea('all',this)">All Areas</button>
  <button class="f-pill area-tl1a" onclick="setArea('tl1a',this)">TL1A</button>
  <button class="f-pill area-tslp" onclick="setArea('tslp',this)">TSLP</button>
  <button class="f-pill area-il4ra" onclick="setArea('il4ra',this)">IL-4Rα</button>
  <button class="f-pill area-igf1r" onclick="setArea('igf1r',this)">IGF1R</button>
  <button class="f-pill area-fcrn" onclick="setArea('fcrn',this)">FcRn</button>
  <button class="f-pill area-tcell" onclick="setArea('tcell',this)">T-cell</button>
  <span class="f-sep"></span>
  <span class="f-count" id="roster-count">—</span>
</div>

<div class="main">
  <!-- Roster (left) -->
  <div class="roster-panel">
    <div class="roster-body" id="roster-body">
      <div class="roster-empty loading-pulse">Loading intelligence…</div>
    </div>
  </div>

  <!-- Detail (right) -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">
      <div class="detail-empty-icon">◈</div>
      <div class="detail-empty-text">Select a company to view their dossier</div>
      <div class="detail-empty-sub">Strategic profile, drug pipeline, trials, deals, recent intel</div>
    </div>
  </div>
</div>

</div><!-- .app -->

<script>
const SUPA_URL = 'https://tghntyofptvfhmtchwcv.supabase.co';
const SUPA_KEY = 'sb_publishable_3GLfZ7b9Tjp9RFRcc4YZew_ov-fY7dI';
const _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── Area colors ──
const AREA_COLORS = {
  tl1a:'#1a3f8f', tslp:'#0e7490', il4ra:'#7c3aed',
  igf1r:'#b45309', fcrn:'#15803d', tcell:'#dc2626'
};
const AREA_LABELS = {
  tl1a:'TL1A', tslp:'TSLP', il4ra:'IL-4Rα',
  igf1r:'IGF1R', fcrn:'FcRn', tcell:'T-cell'
};

// ── State ──
let _roster = [];      // merged rows: queue + profiles + lead drug
let _areaFilter = 'all';
let _sortMode = 'enriched';
let _selectedKey = null; // `${entity_id}::${area_id}`

// ── Stage defs for gap rendering ──
const STAGE_DEFS = [
  { key:'s2', label:'Drug Mapping',       match: f => /^drug:.*:(target|mechanism|differentiation_thesis)$/.test(f) },
  { key:'s3', label:'Trial Intelligence', match: f => /^drug:.*:(has_trials|trial_detail|trial_confidence|trial_canonical_linked)$/.test(f) },
  { key:'s4', label:'Catalysts',          match: f => f === 'catalysts_list' },
  { key:'s5', label:'Strategic Position', match: f => ['company_profile_exists','competitive_position','vs_ailux','key_differentiators'].includes(f) },
  { key:'s6', label:'Deal Intelligence',  match: f => f === 'deals_list' },
];

function _humanField(f) {
  const map = {
    company_profile_exists:'Company Profile', competitive_position:'Competitive Position',
    vs_ailux:'vs. Ailux Analysis', key_differentiators:'Key Differentiators',
    catalysts_list:'Catalyst List', deals_list:'Deal History',
  };
  if (map[f]) return map[f];
  const m = f.match(/^drug:([^:]+):(.+)$/);
  if (m) {
    const fieldMap = { target:'Target', mechanism:'Mechanism', differentiation_thesis:'Differentiation',
      has_trials:'Trial Status', trial_detail:'Trial Detail', trial_confidence:'Trial Confidence',
      trial_canonical_linked:'Trial Link' };
    return `${m[1]} — ${fieldMap[m[2]] || m[2]}`;
  }
  return f;
}

// ── Init ──
async function init() {
  try {
    const [queueRes, profilesRes, drugsRes] = await Promise.all([
      _sb.from('research_queue')
         .select('entity_id,entity_name,area_id,company_id,completeness_score,completeness_tier,priority_score,next_best_action,missing_fields,assigned_status')
         .order('priority_score', { ascending: false }),
      _sb.from('company_profiles')
         .select('company_id,area_id,platform_summary,bd_summary,vs_ailux,key_risk,why_it_matters,strategic_behavior,last_enriched_at,website'),
      _sb.from('drugs')
         .select('entity_id,name,stage,mechanism,route,ailux_competes_directly')
         .order('stage', { ascending: true })
    ]);

    const queue = queueRes.data || [];
    const profiles = profilesRes.data || [];
    const drugs = drugsRes.data || [];

    // Build profile lookup: company_id::area_id → profile
    const profileMap = {};
    profiles.forEach(p => { profileMap[`${p.company_id}::${p.area_id}`] = p; });

    // Build lead drug per entity: entity_id → best drug
    const STAGE_ORDER = ['approved','phase 3','phase 2','phase 1','phase 1/2','preclinical','discovery'];
    const drugMap = {};
    drugs.forEach(d => {
      const eid = d.entity_id;
      if (!eid) return;
      const existing = drugMap[eid];
      if (!existing) { drugMap[eid] = d; return; }
      const newIdx = STAGE_ORDER.findIndex(s => d.stage?.toLowerCase().includes(s.replace('phase ','ph').replace('phase','ph')) || d.stage?.toLowerCase() === s);
      const exIdx  = STAGE_ORDER.findIndex(s => existing.stage?.toLowerCase().includes(s.replace('phase ','ph').replace('phase','ph')) || existing.stage?.toLowerCase() === s);
      if (newIdx !== -1 && (exIdx === -1 || newIdx < exIdx)) drugMap[eid] = d;
    });

    // Merge
    _roster = queue.map(q => {
      const pkey = `${q.company_id}::${q.area_id}`;
      const profile = profileMap[pkey] || null;
      const leadDrug = drugMap[q.entity_id] || null;
      return { ...q, profile, leadDrug };
    });

    renderRoster();
  } catch(e) {
    console.error(e);
    document.getElementById('roster-body').innerHTML = `<div class="roster-empty">Failed to load — ${e.message}</div>`;
  }
}

// ── Render roster ──
function renderRoster() {
  let rows = _roster.filter(r => _areaFilter === 'all' || r.area_id === _areaFilter);

  if (_sortMode === 'enriched') {
    rows.sort((a,b) => {
      const ta = a.profile?.last_enriched_at || '';
      const tb = b.profile?.last_enriched_at || '';
      return tb.localeCompare(ta);
    });
  } else if (_sortMode === 'complete') {
    rows.sort((a,b) => (b.completeness_score||0) - (a.completeness_score||0));
  } else if (_sortMode === 'alpha') {
    rows.sort((a,b) => (a.entity_name||'').localeCompare(b.entity_name||''));
  } else if (_sortMode === 'priority') {
    rows.sort((a,b) => (b.priority_score||0) - (a.priority_score||0));
  }

  document.getElementById('roster-count').textContent = `${rows.length} companies`;

  if (!rows.length) {
    document.getElementById('roster-body').innerHTML = '<div class="roster-empty">No companies in this area yet.</div>';
    return;
  }

  document.getElementById('roster-body').innerHTML = rows.map(r => _renderRosterRow(r)).join('');
}

function _renderRosterRow(r) {
  const areaColor = AREA_COLORS[r.area_id] || '#64748b';
  const areaLabel = AREA_LABELS[r.area_id] || r.area_id;
  const key = `${r.entity_id}::${r.area_id}`;
  const isActive = _selectedKey === key;

  const summary = r.profile?.platform_summary;
  const summaryHtml = summary
    ? `<div class="r-summary">${_esc(summary)}</div>`
    : `<div class="r-summary empty">Profile not yet enriched</div>`;

  let drugHtml = '';
  if (r.leadDrug) {
    const stagePill = _stagePill(r.leadDrug.stage);
    drugHtml = `<span class="r-drug">${_esc(r.leadDrug.name)} ${stagePill}</span>`;
  }

  const freshHtml = _freshLabel(r.profile?.last_enriched_at);

  const tierClass = r.completeness_tier || 'none';
  const score = r.completeness_score || 0;

  return `<div class="r-row${isActive?' active':''} area-${r.area_id}"
              onclick="selectEntity('${_esc(r.entity_id)}','${r.area_id}','${_esc(r.company_id)}',this)"
              data-key="${key}">
    <div class="r-row-top">
      <div class="r-name">${_esc(r.entity_name || r.entity_id)}</div>
      <span class="r-area" style="background:${areaColor}">${areaLabel}</span>
    </div>
    ${summaryHtml}
    <div class="r-row-foot">
      <span class="r-dot ${tierClass}"></span>
      ${drugHtml}
      ${freshHtml}
    </div>
  </div>`;
}

function _freshLabel(iso) {
  if (!iso) return `<span class="r-fresh">Not enriched</span>`;
  const diff = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (diff === 0) return `<span class="r-fresh fresh">Enriched today</span>`;
  if (diff === 1) return `<span class="r-fresh fresh">Yesterday</span>`;
  if (diff <= 7)  return `<span class="r-fresh fresh">${diff}d ago</span>`;
  if (diff <= 30) return `<span class="r-fresh stale">${diff}d ago</span>`;
  return `<span class="r-fresh stale">${diff}d ago</span>`;
}

// ── Select entity ──
async function selectEntity(entityId, areaId, companyId, rowEl) {
  const key = `${entityId}::${areaId}`;
  _selectedKey = key;
  document.querySelectorAll('.r-row').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');

  const dp = document.getElementById('detail-panel');
  dp.innerHTML = `<div class="detail-empty loading-pulse"><div class="detail-empty-icon">◈</div><div class="detail-empty-text">Loading dossier…</div></div>`;

  try {
    const rosterItem = _roster.find(r => r.entity_id === entityId && r.area_id === areaId);
    const profile = rosterItem?.profile;

    const [drugsRes, trialsRes, catalystsRes, dealsRes, intelRes] = await Promise.all([
      _sb.from('drugs').select('*').eq('entity_id', entityId),
      _sb.from('trials').select('*').eq('entity_id', entityId).order('phase'),
      _sb.from('catalysts').select('*').eq('company_id', companyId).eq('resolved', false).order('sort_date'),
      _sb.from('deals').select('*').or(`from_company.ilike.%${entityId}%,to_company.ilike.%${entityId}%,entity_id.eq.${entityId}`).order('deal_date', {ascending:false}).limit(10),
      _sb.from('intel').select('id,title,summary,ailux_angle,importance,published_at').order('published_at',{ascending:false}).limit(100)
        .then(async r => {
          if (!r.data?.length) return { data: [] };
          const ids = r.data.map(i => i.id);
          const jRes = await _sb.from('intel_companies').select('intel_id').eq('company_id', companyId);
          const matched = new Set((jRes.data||[]).map(j => j.intel_id));
          return { data: r.data.filter(i => matched.has(i.id)).slice(0,8) };
        })
    ]);

    const drugs = drugsRes.data || [];
    const trials = trialsRes.data || [];
    const catalysts = catalystsRes.data || [];
    const deals = dealsRes.data || [];
    const intel = intelRes.data || [];

    dp.innerHTML = _buildDossier(rosterItem, profile, drugs, trials, catalysts, deals, intel);
  } catch(e) {
    dp.innerHTML = `<div class="detail-empty"><div class="detail-empty-text">Error loading dossier</div><div class="detail-empty-sub">${_esc(e.message)}</div></div>`;
  }
}

// ── Build dossier HTML ──
function _buildDossier(item, profile, drugs, trials, catalysts, deals, intel) {
  const areaLabel = AREA_LABELS[item.area_id] || item.area_id;
  const areaColor = AREA_COLORS[item.area_id] || '#64748b';
  const score = item.completeness_score || 0;
  const tierClass = item.completeness_tier || 'none';
  const scoreColor = score >= 70 ? '#4ade80' : score >= 40 ? '#f59e0b' : '#ef4444';
  const enrichedStr = profile?.last_enriched_at
    ? `Enriched ${_freshLabel(profile.last_enriched_at).replace(/<[^>]+>/g,'')}`
    : 'Not yet enriched';

  // ── Header ──
  let html = `
  <div class="det-hd">
    <div class="det-hd-top">
      <div>
        <div class="det-name">${_esc(item.entity_name || item.entity_id)}</div>
        <div class="det-badges">
          <span class="det-area" style="background:${areaColor}">${areaLabel}</span>
          ${profile?.website ? `<a href="${_esc(profile.website)}" target="_blank" style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.55);text-decoration:none;border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:1px 7px">${_domain(profile.website)} ↗</a>` : ''}
        </div>
      </div>
    </div>
    <div class="det-score-strip">
      <div><span class="det-score-num">${score}%</span><span class="det-score-label"> complete</span></div>
      <div class="det-score-bar"><div class="det-score-fill" style="width:${score}%;background:${scoreColor}"></div></div>
      <div class="det-enriched">${enrichedStr}</div>
    </div>
  </div>`;

  // ── Strategic Profile ──
  const hasSummary = profile?.platform_summary || profile?.bd_summary;
  const hasPosition = profile?.vs_ailux || profile?.key_risk || profile?.why_it_matters;

  if (hasSummary || hasPosition) {
    html += `<div class="det-profile">`;

    if (hasSummary) {
      html += `<div class="profile-block det-profile-full" style="margin-bottom:${hasPosition?'16px':'0'}">
        <div class="profile-label">Platform Summary</div>
        <div class="profile-text">${_esc(profile?.platform_summary || '')}</div>
      </div>`;
      if (profile?.bd_summary) {
        html += `<div class="profile-block det-profile-full" style="margin-top:-8px;margin-bottom:${hasPosition?'16px':'0'}">
          <div class="profile-label" style="margin-top:12px">BD Summary</div>
          <div class="profile-text">${_esc(profile.bd_summary)}</div>
        </div>`;
      }
    }

    if (profile?.vs_ailux) {
      html += `<div class="det-profile-full">
        <div class="vs-ailux-box">
          <div class="vs-ailux-label">vs. Ailux</div>
          <div class="vs-ailux-text">${_esc(profile.vs_ailux)}</div>
        </div>
      </div>`;
    }

    if (profile?.key_risk || profile?.why_it_matters) {
      html += `<div class="det-profile-grid" style="margin-top:12px">`;
      if (profile?.key_risk) {
        html += `<div class="risk-box"><div class="risk-label">Key Risk</div><div class="risk-text">${_esc(profile.key_risk)}</div></div>`;
      }
      if (profile?.why_it_matters) {
        html += `<div><div class="profile-label">Why It Matters</div><div class="why-text">${_esc(profile.why_it_matters)}</div></div>`;
      }
      html += `</div>`;
    }

    html += `</div>`; // det-profile
  } else {
    html += `<div class="det-profile">
      <div class="profile-text empty">Strategic profile not yet available — pipeline will enrich on next run.</div>
    </div>`;
  }

  // ── Drug Pipeline ──
  html += `<div class="det-section-label">Pipeline & Data</div>`;
  html += `<div class="expander">
    <div class="exp-hd" onclick="toggleExp(this)">
      <span class="exp-toggle open">▶</span>
      <span class="exp-title">Drug Pipeline</span>
      <span class="exp-count">${drugs.length}</span>
      <span class="exp-spacer"></span>
      ${drugs.filter(d=>d.ailux_competes_directly).length ? `<span class="exp-badge red">${drugs.filter(d=>d.ailux_competes_directly).length} direct</span>` : ''}
    </div>
    <div class="exp-body open">`;

  if (!drugs.length) {
    html += `<div class="exp-empty">No drugs mapped yet.</div>`;
  } else {
    html += `<table class="data-table">
      <thead><tr><th>Drug</th><th>Stage</th><th>Mechanism / Target</th><th>Route</th></tr></thead>
      <tbody>`;
    drugs.forEach(d => {
      const stagePillHtml = _stagePill(d.stage);
      const mechTarget = [d.mechanism, d.target].filter(Boolean).join(' · ') || '<span class="cell-muted">—</span>';
      const route = d.route || '<span class="cell-muted">—</span>';
      html += `<tr>
        <td><strong>${_esc(d.name||'—')}</strong>${d.differentiation_thesis?`<div class="diff-text">${_esc(d.differentiation_thesis)}</div>`:''}</td>
        <td>${stagePillHtml}</td>
        <td>${mechTarget}</td>
        <td>${route}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // ── Clinical Trials ──
  const activeTrials = trials.filter(t => /recruiting|active/i.test(t.status||''));
  html += `<div class="expander">
    <div class="exp-hd" onclick="toggleExp(this)">
      <span class="exp-toggle${activeTrials.length?' open':''}">▶</span>
      <span class="exp-title">Clinical Trials</span>
      <span class="exp-count">${trials.length}</span>
      <span class="exp-spacer"></span>
      ${activeTrials.length ? `<span class="exp-badge green">${activeTrials.length} active</span>` : ''}
    </div>
    <div class="exp-body${activeTrials.length?' open':''}">`;

  if (!trials.length) {
    html += `<div class="exp-empty">No trial records linked.</div>`;
  } else {
    html += `<table class="data-table">
      <thead><tr><th>Trial</th><th>Phase</th><th>Indication</th><th>Status</th><th>Completion</th></tr></thead>
      <tbody>`;
    trials.forEach(t => {
      const statusClass = /recruiting/i.test(t.status||'') ? 'trial-recruiting'
        : /active|ongoing/i.test(t.status||'') ? 'trial-active'
        : /completed/i.test(t.status||'') ? 'trial-completed' : 'trial-other';
      html += `<tr>
        <td>${t.source_url?`<a href="${_esc(t.source_url)}" target="_blank" style="color:#2563eb;text-decoration:none">${_esc(t.trial_name||'—')}</a>`:_esc(t.trial_name||'—')}</td>
        <td>${_esc(t.phase||'—')}</td>
        <td>${_esc(t.indication||'—')}</td>
        <td><span class="trial-status ${statusClass}">${_esc(t.status||'—')}</span></td>
        <td>${t.primary_completion_date ? _esc(t.primary_completion_date.split('T')[0]) : '<span class="cell-muted">—</span>'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // ── Catalysts ──
  html += `<div class="expander">
    <div class="exp-hd" onclick="toggleExp(this)">
      <span class="exp-toggle${catalysts.length?' open':''}">▶</span>
      <span class="exp-title">Upcoming Catalysts</span>
      <span class="exp-count">${catalysts.length}</span>
      <span class="exp-spacer"></span>
      ${catalysts.filter(c=>c.is_key_watch).length ? `<span class="exp-badge amber">⚑ ${catalysts.filter(c=>c.is_key_watch).length} key</span>` : ''}
    </div>
    <div class="exp-body${catalysts.length?' open':''}">`;

  if (!catalysts.length) {
    html += `<div class="exp-empty">No upcoming catalysts logged.</div>`;
  } else {
    html += `<table class="data-table">
      <thead><tr><th>Catalyst</th><th>Type</th><th>Date</th><th>Significance</th></tr></thead>
      <tbody>`;
    catalysts.forEach(c => {
      html += `<tr>
        <td>${_esc(c.label||'—')}${c.is_key_watch?` <span style="color:#d97706;font-size:9px;font-weight:800">★ KEY</span>`:''}</td>
        <td>${c.catalyst_type?`<span class="deal-tag">${_esc(c.catalyst_type)}</span>`:'<span class="cell-muted">—</span>'}</td>
        <td>${c.sort_date ? _esc(c.sort_date.split('T')[0]) : '<span class="cell-muted">TBD</span>'}</td>
        <td>${_esc(c.significance||'—')}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // ── BD Deals ──
  html += `<div class="expander">
    <div class="exp-hd" onclick="toggleExp(this)">
      <span class="exp-toggle${deals.length?' open':''}">▶</span>
      <span class="exp-title">BD Deals</span>
      <span class="exp-count">${deals.length}</span>
    </div>
    <div class="exp-body${deals.length?' open':''}">`;

  if (!deals.length) {
    html += `<div class="exp-empty">No deals on record.</div>`;
  } else {
    html += `<table class="data-table">
      <thead><tr><th>Deal</th><th>Partners</th><th>Date</th><th>Signal</th></tr></thead>
      <tbody>`;
    deals.forEach(d => {
      const partners = [d.from_company, d.to_company].filter(Boolean).join(' ↔ ') || '—';
      html += `<tr>
        <td><strong>${_esc(d.deal_type||'Deal')}</strong>${d.value_usd?`<div style="font-size:10px;color:#15803d;font-weight:700">$${_esc(d.value_usd)}</div>`:''}</td>
        <td style="font-size:10.5px">${_esc(partners)}</td>
        <td>${d.deal_date?_esc(d.deal_date.split('T')[0]):'<span class="cell-muted">—</span>'}</td>
        <td style="font-size:10.5px;color:#475569">${_esc(d.ailux_signal||'—')}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;

  // ── Recent Intel ──
  html += `<div class="det-section-label">Intelligence Feed</div>`;
  html += `<div class="expander">
    <div class="exp-hd" onclick="toggleExp(this)">
      <span class="exp-toggle${intel.length?' open':''}">▶</span>
      <span class="exp-title">Recent Intel</span>
      <span class="exp-count">${intel.length}</span>
      ${intel.filter(i=>i.importance==='high').length?`<span class="exp-spacer"></span><span class="exp-badge green">${intel.filter(i=>i.importance==='high').length} high signal</span>`:''}
    </div>
    <div class="exp-body${intel.length?' open':''}">`;

  if (!intel.length) {
    html += `<div class="exp-empty">No intel linked to this company yet.</div>`;
  } else {
    intel.forEach(i => {
      const date = i.published_at ? new Date(i.published_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
      html += `<div class="intel-item">
        <div class="intel-dot" style="${i.importance==='high'?'background:#4ade80':'background:#94a3b8'}"></div>
        <div class="intel-content">
          <div class="intel-title">${_esc(i.title||'')}</div>
          ${i.ailux_angle?`<div class="intel-angle">${_esc(i.ailux_angle)}</div>`:''}
          <div class="intel-meta">${date}</div>
        </div>
      </div>`;
    });
  }
  html += `</div></div>`;

  // ── Research Gaps (collapsed, de-emphasized) ──
  const mf = Array.isArray(item.missing_fields) ? item.missing_fields : [];
  if (mf.length) {
    html += `<div class="gaps-section">
      <div class="gaps-hd" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.gaps-toggle').classList.toggle('open')">
        <span class="gaps-toggle">▶</span>
        <span class="gaps-title">Research Gaps</span>
        <span class="gaps-count">${mf.length} fields missing</span>
      </div>
      <div class="gaps-body">`;

    STAGE_DEFS.forEach(sd => {
      const stageFields = mf.filter(sd.match);
      if (!stageFields.length) return;
      const drugPrefixes = new Set(mf.filter(f=>f.startsWith('drug:')).map(f=>f.split(':')[1]));
      const total = sd.key==='s2'?Math.max(1,drugPrefixes.size)*3:sd.key==='s3'?Math.max(1,drugPrefixes.size)*4:1;
      const pct = Math.round(((total-stageFields.length)/total)*100);
      html += `<div class="gap-stage-group">
        <div class="gap-stage-label">
          ${sd.label}
          <div class="gap-bar-wrap"><div class="gap-bar-fill" style="width:${pct}%"></div></div>
          <span style="font-size:9px;color:#94a3b8">${pct}%</span>
        </div>
        ${stageFields.map(f=>`<span class="gap-chip">${_esc(_humanField(f))}</span>`).join('')}
      </div>`;
    });

    html += `</div></div>`; // gaps-body, gaps-section
  }

  // Next best action (quiet, bottom)
  if (item.next_best_action) {
    html += `<div style="padding:12px 24px;background:#f8fafc;border-bottom:1px solid #f1f5f9">
      <span style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.07em;color:#94a3b8">Next Action · </span>
      <span style="font-size:11px;color:#7c3aed;font-weight:600">${_esc(item.next_best_action)}</span>
    </div>`;
  }

  html += `<div style="height:40px"></div>`; // bottom padding
  return html;
}

// ── Helpers ──
function _stagePill(stage) {
  if (!stage) return '<span class="cell-muted">—</span>';
  const s = stage.toLowerCase();
  const cls = s.includes('approved')?'ph-approved':s.includes('phase 3')||s.includes('ph3')?'ph-3':s.includes('phase 2')||s.includes('ph2')?'ph-2':s.includes('phase 1')||s.includes('ph1')?'ph-1':s.includes('preclinical')?'ph-pre':'ph-disc';
  return `<span class="stage-pill ${cls}">${_esc(stage)}</span>`;
}

function _domain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
}

function _esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleExp(hd) {
  const toggle = hd.querySelector('.exp-toggle');
  const body = hd.nextElementSibling;
  toggle.classList.toggle('open');
  body.classList.toggle('open');
}

function setArea(area, btn) {
  _areaFilter = area;
  document.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderRoster();
}

function applySort(val) {
  _sortMode = val;
  renderRoster();
}

init();
</script>
</body>
</html>
